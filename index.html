<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ルミナスの勇者 - Grand World Edition</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #020617;
            color: #fff;
            font-family: 'Segoe UI', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        #game-wrapper {
            position: relative;
            background-color: #0f172a;
            border: 3px solid #38bdf8;
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(56, 189, 248, 0.4);
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 920px;
            width: 100%;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 22px;
            color: #fbbf24;
            text-shadow: 0 0 12px rgba(251, 191, 36, 0.6);
            letter-spacing: 2px;
        }
        #canvas-container {
            position: relative;
            width: 800px;
            height: 480px;
            border: 3px solid #0284c7;
            border-radius: 8px;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
        #ui-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #020617;
            border: 1px solid #0284c7;
            padding: 10px 18px;
            margin-top: 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
        }
        .stat-group {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .val { color: #38bdf8; }
        .boss-flag { color: #f43f5e; font-weight: bold; }
        #controls-hint {
            margin-top: 8px;
            font-size: 12px;
            color: #94a3b8;
        }
        .key {
            background: #1e293b;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #0284c7;
            color: #38bdf8;
        }
    </style>
</head>
<body>

<div id="game-wrapper">
    <h1>⚔️ ルミナスの勇者 - グランドワールド・クロニクル ⚔️</h1>
    <div id="canvas-container">
        <canvas id="gameCanvas" width="800" height="480"></canvas>
    </div>
    <div id="ui-bar">
        <div class="stat-group">
            <div>LV: <span id="ui-lv" class="val">1</span></div>
            <div>HP: <span id="ui-hp" class="val">120/120</span></div>
            <div>MP: <span id="ui-mp" class="val">50/50</span></div>
            <div>G: <span id="ui-gold" class="val">250</span></div>
            <div>薬: <span id="ui-potions" class="val">3</span></div>
        </div>
        <div class="stat-group">
            <div>四天王撃破: <span id="ui-cadre" class="boss-flag">0 / 4</span></div>
            <div>装備: <span id="ui-weapon" class="val" style="color:#fbbf24">鋼のロングソード</span></div>
            <div>状態: <span id="ui-state" class="val" style="color:#4ade80">フィールド探索</span></div>
        </div>
    </div>
    <div id="controls-hint">
        移動: <span class="key">WASD</span> / <span class="key">↑←↓→</span> | 調べる・決定: <span class="key">SPACE</span> | 戦闘コマンド: <span class="key">1</span> <span class="key">2</span> <span class="key">3</span> <span class="key">4</span>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let gameState = "FIELD"; // "FIELD", "DIALOGUE", "BATTLE", "SHOP", "INN"

// --- 超巨大マップ設定 (3600 x 2800) ---
const WORLD_WIDTH = 3600;
const WORLD_HEIGHT = 2800;
const camera = { x: 0, y: 0, width: 800, height: 480 };

// 武器データベース
const WEAPONS = {
    sword: { id: "sword", name: "鋼のロングソード", type: "斬撃", atk: 25, hitRate: 0.95, price: 0, desc: "標準的な万能剣" },
    dagger: { id: "dagger", name: "影縫いの短剣", type: "刺突", atk: 22, hitRate: 0.98, critRate: 0.35, price: 180, desc: "会心が出やすい軽刃" },
    axe: { id: "axe", name: "ギガントアックス", type: "打撃", atk: 55, hitRate: 0.75, price: 380, desc: "一撃重視の大斧" },
    holy: { id: "holy", name: "聖光のメイス", type: "聖なる光", atk: 45, hitRate: 0.9, price: 550, desc: "魔族特効を持つ聖槌" },
    excalibur: { id: "excalibur", name: "伝説の聖剣ルミナス", type: "神聖", atk: 90, hitRate: 0.99, critRate: 0.25, price: 1300, desc: "魔王を退ける最高峰の剣" }
};

// プレイヤーデータ
const p = {
    x: 750, y: 2150, size: 20, speed: 4.5, dirX: 0, dirY: 1,
    hp: 120, maxHp: 120, mp: 50, maxMp: 50,
    baseAtk: 15, gold: 250, lv: 1, exp: 0, expToNext: 50,
    potions: 3,
    inventory: ["sword"],
    equippedWeapon: "sword",
    isGuarding: false,
    cadreDefeated: { wind: false, water: false, fire: false, thunder: false }
};

let currentTarget = null;
let currentShopType = null;
let shopSelection = 0;
let battleLog = "戦闘開始！コマンドを選択してください。";
let battleMenuMode = "MAIN";
let battleAnimTimer = 0;
let activeEffect = null;

// --- 大大規模な「始まりの王国ルミナス」とNPCの配置 ---
const npcs = [
    { x: 750, y: 1920, name: "国王ルミナス", type: "king", text: "勇者よ！各拠点の3人の配下を倒して幹部を引きずり出し、四天王を滅ぼさねば魔王城の結界は解かれぬぞ！" },
    { x: 500, y: 2050, name: "武器屋の鍛冶職人", type: "merchant", role: "SHOP_WEAPON", text: "強力な武器を買いそろえて旅立つといい！" },
    { x: 950, y: 2050, name: "道具屋の店主", type: "merchant", role: "SHOP_ITEM", text: "回復の薬（50G）を売っているよ。" },
    { x: 500, y: 2300, name: "王立宿屋", type: "inn", role: "INN", text: "1泊 40G で完全に休息できます。" },
    { x: 750, y: 2100, name: "王国騎士長", type: "knight", text: "幹部たちの周りには強固な配下が3人配備されている。配下を倒さねば幹部本体には挑めないぞ！" },
    { x: 600, y: 2180, name: "町娘マリア", type: "townsfolk", text: "広場の噴水は私たちの憩いの場所なんです。" },
    { x: 900, y: 2220, name: "学者ルーク", type: "scholar", text: "魔王城は結界で護られており、四天王を全滅させるまで侵入すら不可能です。" }
];

// 敵一覧（四天王 + 幹部の配下3人ずつ + 最終魔王）
let enemies = [
    // 🌪️ 疾風の四天王 ＆ 配下3人
    { x: 600, y: 600, name: "【疾風将】ゼファー", hp: 380, maxHp: 380, atk: 34, exp: 280, gold: 350, type: "cadre_wind", size: 36, isCadre: "wind" },
    { x: 520, y: 550, name: "疾風の護衛・アスカ", hp: 130, maxHp: 130, atk: 20, exp: 60, gold: 80, type: "sub_wind", size: 26, isSubCadre: true, parentCadre: "wind" },
    { x: 680, y: 550, name: "疾風の護衛・フウガ", hp: 130, maxHp: 130, atk: 20, exp: 60, gold: 80, type: "sub_wind", size: 26, isSubCadre: true, parentCadre: "wind" },
    { x: 600, y: 690, name: "疾風の護衛・ハヤテ", hp: 140, maxHp: 140, atk: 22, exp: 70, gold: 90, type: "sub_wind", size: 26, isSubCadre: true, parentCadre: "wind" },

    // ❄️ 氷華の四天王 ＆ 配下3人
    { x: 3000, y: 600, name: "【氷華后】アクアリア", hp: 450, maxHp: 450, atk: 40, exp: 380, gold: 450, type: "cadre_water", size: 36, isCadre: "water" },
    { x: 2920, y: 550, name: "氷華の近衛・シグラ", hp: 160, maxHp: 160, atk: 25, exp: 90, gold: 110, type: "sub_water", size: 26, isSubCadre: true, parentCadre: "water" },
    { x: 3080, y: 550, name: "氷華の近衛・ヒョウガ", hp: 160, maxHp: 160, atk: 25, exp: 90, gold: 110, type: "sub_water", size: 26, isSubCadre: true, parentCadre: "water" },
    { x: 3000, y: 690, name: "氷華の近衛・フロスト", hp: 180, maxHp: 180, atk: 27, exp: 100, gold: 120, type: "sub_water", size: 26, isSubCadre: true, parentCadre: "water" },

    // 🔥 業火の四天王 ＆ 配下3人
    { x: 600, y: 1400, name: "【業火帝】ブレイズ", hp: 550, maxHp: 550, atk: 48, exp: 550, gold: 550, type: "cadre_fire", size: 38, isCadre: "fire" },
    { x: 520, y: 1350, name: "業火の突撃兵・プロメノ", hp: 210, maxHp: 210, atk: 32, exp: 130, gold: 140, type: "sub_fire", size: 26, isSubCadre: true, parentCadre: "fire" },
    { x: 680, y: 1350, name: "業火の突撃兵・イグニス", hp: 210, maxHp: 210, atk: 32, exp: 130, gold: 140, type: "sub_fire", size: 26, isSubCadre: true, parentCadre: "fire" },
    { x: 600, y: 1490, name: "業火の突撃兵・ヘルフレア", hp: 230, maxHp: 230, atk: 35, exp: 150, gold: 160, type: "sub_fire", size: 26, isSubCadre: true, parentCadre: "fire" },

    // ⚡ 雷鳴の四天王 ＆ 配下3人
    { x: 3000, y: 1400, name: "【雷鳴王】ボルト", hp: 700, maxHp: 700, atk: 58, exp: 750, gold: 750, type: "cadre_thunder", size: 40, isCadre: "thunder" },
    { x: 2920, y: 1350, name: "雷鳴の執行官・ライガ", hp: 260, maxHp: 260, atk: 40, exp: 180, gold: 200, type: "sub_thunder", size: 26, isSubCadre: true, parentCadre: "thunder" },
    { x: 3080, y: 1350, name: "雷鳴の執行官・ヴォルト", hp: 260, maxHp: 260, atk: 40, exp: 180, gold: 200, type: "sub_thunder", size: 26, isSubCadre: true, parentCadre: "thunder" },
    { x: 3000, y: 1490, name: "雷鳴の執行官・サンダー", hp: 290, maxHp: 290, atk: 43, exp: 210, gold: 230, type: "sub_thunder", size: 26, isSubCadre: true, parentCadre: "thunder" },

    // 👑 最終魔王
    { x: 1800, y: 400, name: "【終焉の魔王】ルシフェル", hp: 1300, maxHp: 1300, atk: 75, exp: 0, gold: 0, type: "lucifel", size: 50, isBoss: true }
];

// 野良雑魚モンスター（移動データを持つ）
const mobTypes = [
    { name: "スライム", hp: 40, atk: 8, exp: 15, gold: 20, type: "slime" },
    { name: "野良ゴブリン", hp: 70, atk: 14, exp: 30, gold: 35, type: "goblin" },
    { name: "荒野のオーク", hp: 110, atk: 22, exp: 50, gold: 60, type: "oak" },
    { name: "岩石ゴーレム", hp: 200, atk: 32, exp: 90, gold: 100, type: "golem" }
];

for (let i = 0; i < 35; i++) {
    const mobTemplate = mobTypes[Math.floor(Math.random() * mobTypes.length)];
    let rx = Math.random() * WORLD_WIDTH;
    let ry = Math.random() * WORLD_HEIGHT;
    if (rx > 200 && rx < 1300 && ry > 1700 && ry < 2600) {
        rx += 1200;
    }
    enemies.push({
        x: rx, y: ry,
        vx: 0, vy: 0, moveTimer: 0,
        name: mobTemplate.name,
        hp: mobTemplate.hp, maxHp: mobTemplate.hp,
        atk: mobTemplate.atk, exp: mobTemplate.exp, gold: mobTemplate.gold,
        type: mobTemplate.type, size: 24, isWandering: true
    });
}

// 環境装飾
const mapDecorations = [];
function generateWorldDecorations() {
    for (let i = 0; i < 600; i++) {
        mapDecorations.push({
            type: 'tree',
            x: Math.random() * WORLD_WIDTH,
            y: Math.random() * WORLD_HEIGHT,
            scale: 0.8 + Math.random() * 0.5
        });
    }
    for (let i = 0; i < 700; i++) {
        mapDecorations.push({
            type: 'flower',
            x: Math.random() * WORLD_WIDTH,
            y: Math.random() * WORLD_HEIGHT,
            color: ['#f43f5e', '#fbbf24', '#c084fc', '#38bdf8'][Math.floor(Math.random() * 4)]
        });
    }
}
generateWorldDecorations();

const keys = {};

window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (gameState === "FIELD" && e.code === 'Space') {
        checkFieldInteraction();
    } else if (gameState === "DIALOGUE" && e.code === 'Space') {
        gameState = "FIELD";
    } else if (gameState === "SHOP") {
        handleShopInput(e.code);
    } else if (gameState === "INN" && e.code === 'Space') {
        executeInn();
    } else if (gameState === "BATTLE") {
        handleBattleInput(e.code);
    }
});

window.addEventListener('keyup', e => { keys[e.code] = false; });

function getDefeatedCadreCount() {
    return Object.values(p.cadreDefeated).filter(Boolean).length;
}

function updateUI() {
    document.getElementById('ui-lv').innerText = p.lv;
    document.getElementById('ui-hp').innerText = `${Math.max(0, p.hp)}/${p.maxHp}`;
    document.getElementById('ui-mp').innerText = `${Math.max(0, p.mp)}/${p.maxMp}`;
    document.getElementById('ui-gold').innerText = p.gold;
    document.getElementById('ui-potions').innerText = p.potions;
    document.getElementById('ui-cadre').innerText = `${getDefeatedCadreCount()} / 4`;
    document.getElementById('ui-weapon').innerText = WEAPONS[p.equippedWeapon].name;
    
    const stateEl = document.getElementById('ui-state');
    if (gameState === "FIELD") { stateEl.innerText = "フィールド探索"; stateEl.style.color = "#4ade80"; }
    else if (gameState === "DIALOGUE") { stateEl.innerText = "会話中"; stateEl.style.color = "#fbbf24"; }
    else if (gameState === "SHOP") { stateEl.innerText = "ショップ利用中"; stateEl.style.color = "#38bdf8"; }
    else if (gameState === "BATTLE") { stateEl.innerText = "ターン制バトル"; stateEl.style.color = "#f87171"; }
}

function checkFieldInteraction() {
    for (let npc of npcs) {
        if (Math.hypot(p.x - npc.x, p.y - npc.y) < 45) {
            currentTarget = npc;
            if (npc.role === "SHOP_WEAPON") {
                gameState = "SHOP"; currentShopType = "WEAPON"; shopSelection = 0;
            } else if (npc.role === "SHOP_ITEM") {
                gameState = "SHOP"; currentShopType = "ITEM"; shopSelection = 0;
            } else if (npc.role === "INN") {
                gameState = "INN";
            } else {
                gameState = "DIALOGUE";
            }
            updateUI();
            return;
        }
    }

    for (let enemy of enemies) {
        if (Math.hypot(p.x - enemy.x, p.y - enemy.y) < 45) {
            // 幹部の挑戦判定（配下3人の撃破チェック）
            if (enemy.isCadre) {
                const subLeft = enemies.filter(e => e.isSubCadre && e.parentCadre === enemy.isCadre).length;
                if (subLeft > 0) {
                    alert(`⚠️ 周囲の配下をあと ${subLeft} 人倒さなければ、幹部【${enemy.name}】に挑むことはできない！`);
                    return;
                }
            }
            // 魔王判定
            if (enemy.isBoss && getDefeatedCadreCount() < 4) {
                alert(`🛡️ 強大な結界が阻んでいる！ 四天王（残り ${4 - getDefeatedCadreCount()} 人）を撃破しなければ魔王には挑めない！`);
                return;
            }
            startBattle(enemy);
            return;
        }
    }
}

function handleShopInput(code) {
    if (code === 'KeyW' || code === 'ArrowUp') shopSelection = Math.max(0, shopSelection - 1);
    if (code === 'KeyS' || code === 'ArrowDown') shopSelection++;
    
    if (currentShopType === "WEAPON") {
        const weaponKeys = Object.keys(WEAPONS);
        shopSelection = Math.min(weaponKeys.length - 1, shopSelection);
        if (code === 'Space') {
            const wKey = weaponKeys[shopSelection];
            const w = WEAPONS[wKey];
            if (p.inventory.includes(wKey)) {
                p.equippedWeapon = wKey;
                alert(`🗡️ 【${w.name}】を装備しました！`);
            } else if (p.gold >= w.price) {
                p.gold -= w.price;
                p.inventory.push(wKey);
                p.equippedWeapon = wKey;
                alert(`🛒 【${w.name}】を購入し、装備しました！`);
            } else {
                alert("⚠️ ゴールドが足りません！");
            }
        }
    } else if (currentShopType === "ITEM") {
        shopSelection = 0;
        if (code === 'Space') {
            if (p.gold >= 50) {
                p.gold -= 50;
                p.potions++;
                alert("🧪 回復の薬を購入しました！ (HP 80回復)");
            } else {
                alert("⚠️ ゴールドが足りません！");
            }
        }
    }
    if (code === 'Escape') gameState = "FIELD";
    updateUI();
}

function executeInn() {
    if (p.gold >= 40) {
        p.gold -= 40;
        p.hp = p.maxHp;
        p.mp = p.maxMp;
        alert("🏨 王立宿屋で旅の疲れを癒やした！ HPとMPが全回復！");
    } else {
        alert("⚠️ ゴールドが足りません！");
    }
    gameState = "FIELD";
    updateUI();
}

function startBattle(enemy) {
    currentTarget = enemy;
    gameState = "BATTLE";
    battleMenuMode = "MAIN";
    p.isGuarding = false;
    battleLog = `⚔️ ${enemy.name} が立ちはだかった！`;
    updateUI();
}

function handleBattleInput(code) {
    if (battleMenuMode === "MAIN") {
        if (code === 'Digit1') executePlayerAttack();
        else if (code === 'Digit2') battleMenuMode = "WEAPON_SELECT";
        else if (code === 'Digit3') battleMenuMode = "SKILL_SELECT";
        else if (code === 'Digit4') executePlayerGuard();
    } else if (battleMenuMode === "WEAPON_SELECT") {
        const weaponKeys = p.inventory;
        if (code === 'Digit1' && weaponKeys[0]) p.equippedWeapon = weaponKeys[0];
        if (code === 'Digit2' && weaponKeys[1]) p.equippedWeapon = weaponKeys[1];
        if (code === 'Digit3' && weaponKeys[2]) p.equippedWeapon = weaponKeys[2];
        if (code === 'Digit4' && weaponKeys[3]) p.equippedWeapon = weaponKeys[3];
        battleLog = `🗡️ 武器を【${WEAPONS[p.equippedWeapon].name}】に変更！`;
        battleMenuMode = "MAIN";
        updateUI();
    } else if (battleMenuMode === "SKILL_SELECT") {
        if (code === 'Digit1') executeSkill("heal");
        else if (code === 'Digit2') executeSkill("fire");
        else if (code === 'Digit3') executeSkill("item");
        else battleMenuMode = "MAIN";
    }
}

function executePlayerAttack() {
    const w = WEAPONS[p.equippedWeapon];
    const hit = Math.random() < w.hitRate;
    let isCrit = w.critRate && Math.random() < w.critRate;

    activeEffect = "SLASH";
    setTimeout(() => { activeEffect = null; }, 600);

    if (!hit) {
        battleLog = `⚔️ 攻撃を繰り出したが ${currentTarget.name} にかわされた！`;
    } else {
        let dmg = p.baseAtk + w.atk + Math.floor(Math.random() * 10);
        if (isCrit) dmg = Math.floor(dmg * 1.8);
        currentTarget.hp -= dmg;
        battleLog = `💥 ${w.name} の一撃！ ${currentTarget.name} に ${dmg} ダメージ！${isCrit ? " (会心の一撃！)" : ""}`;
    }

    if (checkBattleEnd()) return;
    setTimeout(enemyTurn, 1000);
}

function executePlayerGuard() {
    p.isGuarding = true;
    battleLog = "🛡️ 盾を構えてガード態勢を取った！ (被ダメージ半減)";
    setTimeout(enemyTurn, 1000);
}

function executeSkill(type) {
    if (type === "heal") {
        if (p.mp < 12) { battleLog = "⚠️ MPが足りない！"; return; }
        p.mp -= 12;
        p.hp = Math.min(p.maxHp, p.hp + 65);
        activeEffect = "HEAL";
        setTimeout(() => { activeEffect = null; }, 600);
        battleLog = "✨ 聖なる祈り！ HPが 65 回復！";
    } else if (type === "fire") {
        if (p.mp < 18) { battleLog = "⚠️ MPが足りない！"; return; }
        p.mp -= 18;
        const dmg = 90;
        currentTarget.hp -= dmg;
        activeEffect = "FIRE";
        setTimeout(() => { activeEffect = null; }, 600);
        battleLog = `🔥 爆炎呪文ヴォルカノ！ ${currentTarget.name} に ${dmg} ダメージ！`;
    } else if (type === "item") {
        if (p.potions <= 0) { battleLog = "⚠️ 回復の薬がない！"; return; }
        p.potions--;
        p.hp = Math.min(p.maxHp, p.hp + 80);
        activeEffect = "HEAL";
        setTimeout(() => { activeEffect = null; }, 600);
        battleLog = "🧪 回復の薬を使用！ HPが 80 回復！";
    }
    battleMenuMode = "MAIN";
    updateUI();
    if (checkBattleEnd()) return;
    setTimeout(enemyTurn, 1000);
}

function enemyTurn() {
    if (currentTarget.hp <= 0) return;
    let dmg = currentTarget.atk + Math.floor(Math.random() * 8);
    if (p.isGuarding) dmg = Math.floor(dmg * 0.5);

    p.hp -= dmg;
    p.isGuarding = false;
    activeEffect = "ENEMY_ATTACK";
    setTimeout(() => { activeEffect = null; }, 600);

    battleLog = `💥 ${currentTarget.name} の苛烈な攻撃！ 勇者は ${dmg} ダメージを受けた！`;

    if (p.hp <= 0) {
        alert("💀 勇者は倒れてしまった… 王国ルミナスで復活します。");
        p.hp = p.maxHp;
        p.mp = p.maxMp;
        gameState = "FIELD";
        p.x = 750; p.y = 2150;
    }
    updateUI();
}

function checkBattleEnd() {
    if (currentTarget.hp <= 0) {
        p.gold += currentTarget.gold;
        p.exp += currentTarget.exp;
        battleLog = `🎉 ${currentTarget.name} を討ち果した！ (${currentTarget.exp} EXP, +${currentTarget.gold}G)`;

        if (currentTarget.isCadre) {
            p.cadreDefeated[currentTarget.isCadre] = true;
            alert(`🏆 四天王【${currentTarget.name}】を撃破！ (残り四天王: ${4 - getDefeatedCadreCount()} 人)`);
        } else if (currentTarget.isSubCadre) {
            const subLeft = enemies.filter(e => e.isSubCadre && e.parentCadre === currentTarget.parentCadre && e !== currentTarget).length;
            alert(`⚔️ 配下【${currentTarget.name}】を撃破！ (残り配下: ${subLeft} 人)`);
        }

        if (p.exp >= p.expToNext) {
            p.lv++;
            p.maxHp += 25; p.hp = p.maxHp;
            p.maxMp += 10; p.mp = p.maxMp;
            p.baseAtk += 6;
            p.expToNext = Math.floor(p.expToNext * 1.6);
            alert(`🌟 LEVEL UP! LV ${p.lv} になった！ (最大HP/MP・攻撃力上昇)`);
        }

        enemies = enemies.filter(e => e !== currentTarget);
        setTimeout(() => {
            if (currentTarget.isBoss) {
                alert("🎊 CONGRATULATIONS!\n終焉の魔王ルシフェルを討ち破り、世界に永遠の平和が訪れた！");
            }
            gameState = "FIELD";
            updateUI();
        }, 1200);
        return true;
    }
    return false;
}

function update() {
    battleAnimTimer += 0.05;
    if (gameState !== "FIELD") return;

    // 1. プレイヤー移動処理
    let dx = 0, dy = 0;
    if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
    if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) dx += 1;

    if (dx !== 0 || dy !== 0) {
        const len = Math.hypot(dx, dy);
        p.dirX = dx / len; p.dirY = dy / len;
        let nextX = p.x + p.dirX * p.speed;
        let nextY = p.y + p.dirY * p.speed;

        // ★【魔王城の進入制限処理】★
        // 四天王4人未撃破の段階では魔王城のエリア (x: 1620~1980, y: 180~580) へ進入不可
        if (getDefeatedCadreCount() < 4) {
            if (nextX > 1620 && nextX < 1980 && nextY > 180 && nextY < 580) {
                alert(`🛡️ 強大な紅蓮結界が阻んでいる！\n四天王（残り ${4 - getDefeatedCadreCount()} 人）をすべて討伐するまで魔王城へ侵入することはできない！`);
                // ノックバック処理
                nextX = p.x;
                nextY = p.y + 15;
            }
        }

        p.x = Math.max(20, Math.min(WORLD_WIDTH - 20, nextX));
        p.y = Math.max(20, Math.min(WORLD_HEIGHT - 20, nextY));
    }

    // 2. 野良雑魚モンスターのランダム移動AI & 衝突判定
    enemies.forEach(e => {
        if (e.isWandering) {
            e.moveTimer--;
            if (e.moveTimer <= 0) {
                const angle = Math.random() * Math.PI * 2;
                const spd = 0.8 + Math.random() * 1.2;
                e.vx = Math.cos(angle) * spd;
                e.vy = Math.sin(angle) * spd;
                e.moveTimer = 40 + Math.floor(Math.random() * 80);
            }
            e.x += e.vx;
            e.y += e.vy;

            e.x = Math.max(100, Math.min(WORLD_WIDTH - 100, e.x));
            e.y = Math.max(100, Math.min(WORLD_HEIGHT - 100, e.y));
        }

        // プレイヤーとの接敵判定
        if (Math.hypot(p.x - e.x, p.y - e.y) < p.size + e.size) {
            if (e.isCadre) {
                const subLeft = enemies.filter(sub => sub.isSubCadre && sub.parentCadre === e.isCadre).length;
                if (subLeft > 0) {
                    alert(`⚠️ 配下が残り ${subLeft} 人残っている！ まずは周囲の配下を倒さねば幹部【${e.name}】には挑めない！`);
                    p.y += 10;
                    return;
                }
            }
            if (e.isBoss && getDefeatedCadreCount() < 4) return;
            startBattle(e);
        }
    });

    camera.x = Math.max(0, Math.min(WORLD_WIDTH - camera.width, p.x - camera.width / 2));
    camera.y = Math.max(0, Math.min(WORLD_HEIGHT - camera.height, p.y - camera.height / 2));
}

    // 敵

    }

    // 敵HP
    ctx.fillStyle = "rgba(15, 23, 42, 0.85)"; ctx.fillRect(40, 20, 280, 60);
    ctx.fillStyle = "#fff"; ctx.font = "bold 15px sans-serif"; ctx.textAlign = "left";
    ctx.fillText(currentTarget.name, 55, 42);
    ctx.fillStyle = "#1e293b"; ctx.fillRect(55, 52, 240, 12);
    ctx.fillStyle = "#ef4444"; ctx.fillRect(55, 52, 240 * Math.max(0, currentTarget.hp / currentTarget.maxHp), 12);

    // 勇者HP
    ctx.fillStyle = "rgba(15, 23, 42, 0.85)"; ctx.fillRect(480, 210, 280, 65);
    ctx.fillStyle = "#fbbf24"; ctx.font = "bold 15px sans-serif";
    ctx.fillText(`勇者 (LV ${p.lv})`, 495, 232);
    ctx.fillStyle = "#1e293b"; ctx.fillRect(495, 242, 250, 10);
    ctx.fillStyle = "#4ade80"; ctx.fillRect(495, 242, 250 * Math.max(0, p.hp / p.maxHp), 10);
    ctx.fillStyle = "#38bdf8"; ctx.font = "bold 12px sans-serif";
    ctx.fillText(`HP: ${p.hp}/${p.maxHp}  MP: ${p.mp}/${p.maxMp}`, 495, 266);

    // ログ
    ctx.fillStyle = "rgba(15, 23, 42, 0.95)"; ctx.fillRect(30, 285, 740, 45);
    ctx.fillStyle = "#38bdf8"; ctx.font = "14px sans-serif"; ctx.fillText(battleLog, 45, 312);

    // コマンド
    ctx.fillStyle = "rgba(15, 23, 42, 0.95)"; ctx.fillRect(30, 340, 740, 125);
    if (battleMenuMode === "MAIN") {
        drawMenuButton("1. 武器攻撃", 60, 360, 320, 40, "#38bdf8");
        drawMenuButton("2. 武器換装", 420, 360, 320, 40, "#fbbf24");
        drawMenuButton("3. 魔法・道具", 60, 410, 320, 40, "#a855f7");
        drawMenuButton("4. 防御", 420, 410, 320, 40, "#4ade80");
    } else if (battleMenuMode === "WEAPON_SELECT") {
        const inv = p.inventory;
        drawMenuButton(`1. ${WEAPONS[inv[0]] ? WEAPONS[inv[0]].name : '-'}`, 60, 360, 320, 40, "#38bdf8");
        drawMenuButton(`2. ${WEAPONS[inv[1]] ? WEAPONS[inv[1]].name : '-'}`, 420, 360, 320, 40, "#38bdf8");
        drawMenuButton(`3. ${WEAPONS[inv[2]] ? WEAPONS[inv[2]].name : '-'}`, 60, 410, 320, 40, "#38bdf8");
        drawMenuButton(`4. ${WEAPONS[inv[3]] ? WEAPONS[inv[3]].name : '-'}`, 420, 410, 320, 40, "#38bdf8");
    } else if (battleMenuMode === "SKILL_SELECT") {
        drawMenuButton("1. 回復呪文 (12 MP)", 60, 360, 320, 40, "#a855f7");
        drawMenuButton("2. 爆炎呪文 (18 MP)", 420, 360, 320, 40, "#a855f7");
        drawMenuButton(`3. 回復の薬 (${p.potions}個)`, 60, 410, 320, 40, "#4ade80");
    }
}

function drawMenuButton(text, x, y, w, h, color) {
    ctx.fillStyle = "#1e293b"; ctx.strokeStyle = color; ctx.lineWidth = 2;
    ctx.fillRect(x, y, w, h); ctx.strokeRect(x, y, w, h);
    ctx.fillStyle = color; ctx.font = "bold 14px sans-serif"; ctx.textAlign = "left";
    ctx.fillText(text, x + 15, y + 25);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (gameState === "FIELD") drawField();
    else if (gameState === "DIALOGUE" || gameState === "INN") drawDialogueView();
    else if (gameState === "SHOP") drawShopView();
    else if (gameState === "BATTLE") drawBattleView();
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

updateUI();
gameLoop();

</script>
</body>
</html>
