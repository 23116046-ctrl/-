<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ルミナスの勇者 - 2D Open World Action RPG</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #0f0f1d;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        #game-wrapper {
            position: relative;
            background-color: #1a1a2e;
            border: 3px solid #e94560;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.4);
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 840px;
            width: 100%;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 22px;
            color: #f1c40f;
            text-shadow: 2px 2px 4px #000;
            letter-spacing: 2px;
        }
        #canvas-container {
            position: relative;
            width: 800px;
            height: 480px;
            border: 2px solid #16213e;
            border-radius: 8px;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
            background-color: #333;
        }
        #ui-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #16213e;
            padding: 8px 15px;
            margin-top: 10px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
        }
        .stat-group {
            display: flex;
            gap: 15px;
        }
        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .val {
            color: #f1c40f;
        }
        #msg-log {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid #e94560;
            color: #fff;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 13px;
            pointer-events: none;
            max-height: 70px;
            overflow-y: auto;
            line-height: 1.4;
        }
        #controls-hint {
            margin-top: 10px;
            font-size: 12px;
            color: #a0a0a0;
            text-align: center;
        }
        .key {
            background: #333;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #555;
            color: #fff;
        }
    </style>
</head>
<body>

<div id="game-wrapper">
    <h1>⚔️ ルミナスの勇者 2D ⚔️</h1>
    <div id="canvas-container">
        <canvas id="gameCanvas" width="800" height="480"></canvas>
        <div id="msg-log">【広大なルミナス大陸へようこそ！】<br>矢印キーまたはWASDで移動、[SPACE]で攻撃！草むらやダンジョンで敵を倒してレベルアップしよう！</div>
    </div>
    <div id="ui-bar">
        <div class="stat-group">
            <div class="stat-item">LV: <span id="ui-lv" class="val">1</span></div>
            <div class="stat-item">HP: <span id="ui-hp" class="val">100/100</span></div>
            <div class="stat-item">ATK: <span id="ui-atk" class="val">15</span></div>
            <div class="stat-item">EXP: <span id="ui-exp" class="val">0/20</span></div>
            <div class="stat-item">所持金: <span id="ui-gold" class="val">50</span> G</div>
        </div>
        <div class="stat-group">
            <div class="stat-item">エリア: <span id="ui-area" class="val" style="color:#00fff0">ルミナス平原</span></div>
            <div class="stat-item">宝珠: <span id="ui-orbs" class="val" style="color:#ff0055">0/4</span></div>
        </div>
    </div>
    <div id="controls-hint">
        操作方法: <span class="key">WASD</span> / <span class="key">↑←↓→</span> 移動 | <span class="key">SPACE</span> 攻撃 / 決定 | 各エリアのシンボル（町/ダンジョン）に触れると移動できます
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Game State
const p = {
    x: 400, y: 240, size: 20, speed: 3.5,
    dirX: 0, dirY: 1,
    hp: 100, maxHp: 100,
    atk: 15,
    lv: 1, exp: 0, maxExp: 20,
    gold: 50,
    orbs: { fire: false, wind: false, water: false, shadow: false },
    weapon: "初期の剣",
    isAttacking: false,
    attackTimer: 0,
    attackRect: null,
    invincibleTimer: 0
};

let currentMap = "world"; // world, town_luminous, volcano, silphy, aquaris, granval, demon_castle
let enemies = [];
let npcs = [];
let transitions = [];
let particles = [];

const keys = {};

window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if(e.code === 'Space') {
        playerAttack();
        e.preventDefault();
    }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

function addLog(msg) {
    const log = document.getElementById('msg-log');
    log.innerHTML = msg;
}

function updateUI() {
    document.getElementById('ui-lv').innerText = p.lv;
    document.getElementById('ui-hp').innerText = `${Math.max(0, p.hp)}/${p.maxHp}`;
    document.getElementById('ui-atk').innerText = p.atk;
    document.getElementById('ui-exp').innerText = `${p.exp}/${p.maxExp}`;
    document.getElementById('ui-gold').innerText = p.gold;
    
    const orbCount = Object.values(p.orbs).filter(Boolean).length;
    document.getElementById('ui-orbs').innerText = `${orbCount}/4`;

    const mapNames = {
        world: "ルミナス広大世界",
        town_luminous: "ルミナス村（故郷）",
        volcano: "ボルカノ火山（火の領土）",
        silphy: "シルフィ迷宮樹海（風の領土）",
        aquaris: "アクアリス海底・港（水の領土）",
        granval: "グラン・ヴァル霊峰（影の領土）",
        demon_castle: "魔王城"
    };
    document.getElementById('ui-area').innerText = mapNames[currentMap] || "ダンジョン";
}

// Level Up
function checkLevelUp() {
    if(p.exp >= p.maxExp) {
        p.exp -= p.maxExp;
        p.lv++;
        p.maxExp = Math.floor(p.maxExp * 1.5);
        p.maxHp += 20;
        p.hp = p.maxHp;
        p.atk += 5;
        addLog(`🎉 **レベルアップ！** LV.${p.lv} になった！ (最大HP+20, 攻撃力+5)`);
        createParticles(p.x, p.y, '#f1c40f', 20);
    }
}

// Map Setup
function loadMap(mapName, startX, startY) {
    currentMap = mapName;
    p.x = startX || 400;
    p.y = startY || 240;
    enemies = [];
    npcs = [];
    transitions = [];

    if(mapName === "world") {
        // Town Icons on World Map
        transitions.push({ x: 380, y: 220, w: 40, h: 40, name: "town_luminous", color: "#2ecc71", label: "ルミナス村" });
        transitions.push({ x: 120, y: 120, w: 40, h: 40, name: "volcano", color: "#e74c3c", label: "ボルカノ" });
        transitions.push({ x: 650, y: 120, w: 40, h: 40, name: "silphy", color: "#1abc9c", label: "シルフィ" });
        transitions.push({ x: 650, y: 350, w: 40, h: 40, name: "aquaris", color: "#3498db", label: "アクアリス" });
        transitions.push({ x: 120, y: 350, w: 40, h: 40, name: "granval", color: "#9b59b6", label: "グラン・ヴァル" });
        transitions.push({ x: 380, y: 50, w: 40, h: 40, name: "demon_castle", color: "#34495e", label: "魔王城" });

        // World Field Random Monsters
        spawnEnemies([
            { name: "スライム", hp: 20, atk: 5, exp: 8, gold: 5, color: "#3498db", size: 16 },
            { name: "ゴブリン", hp: 35, atk: 8, exp: 15, gold: 12, color: "#2ecc71", size: 18 },
            { name: "野良オーク", hp: 60, atk: 12, exp: 25, gold: 20, color: "#e67e22", size: 22 }
        ], 8);
    } 
    else if(mapName === "town_luminous") {
        transitions.push({ x: 380, y: 440, w: 40, h: 30, name: "world", color: "#f39c12", label: "フィールドへ", targetX: 390, targetY: 270 });
        
        npcs.push({ x: 200, y: 150, name: "長老", text: "長老「魔王を倒すには4つの『四精霊の宝珠』が必要じゃ。各地を巡りレベルを上げて挑むのだ！」", type: "elder" });
        npcs.push({ x: 550, y: 150, name: "宿屋", text: "宿屋「休んでいきなさい！」(HPが全回復した)", type: "inn" });
        npcs.push({ x: 380, y: 100, name: "鍛冶屋", text: "鍛冶屋「100Gで武器を強化してやるぞ！」", type: "smith" });
    }
    else if(mapName === "volcano") {
        transitions.push({ x: 380, y: 440, w: 40, h: 30, name: "world", color: "#f39c12", label: "フィールドへ", targetX: 130, targetY: 170 });
        
        if(!p.orbs.fire) {
            enemies.push({ x: 400, y: 120, name: "🔥 炎将ガルダ (BOSS)", hp: 250, maxHp: 250, atk: 18, exp: 120, gold: 200, color: "#e74c3c", size: 36, isBoss: true, orb: "fire" });
        }
        spawnEnemies([
            { name: "マグマゴーレム", hp: 80, atk: 15, exp: 35, gold: 25, color: "#d35400", size: 24 },
            { name: "火炎インプ", hp: 50, atk: 14, exp: 30, gold: 20, color: "#c0392b", size: 18 }
        ], 5);
    }
    else if(mapName === "silphy") {
        transitions.push({ x: 380, y: 440, w: 40, h: 30, name: "world", color: "#f39c12", label: "フィールドへ", targetX: 650, targetY: 170 });
        
        if(!p.orbs.wind) {
            enemies.push({ x: 400, y: 120, name: "🌪️ 幻影妃セレーネ (BOSS)", hp: 320, maxHp: 320, atk: 22, exp: 180, gold: 250, color: "#1abc9c", size: 36, isBoss: true, orb: "wind" });
        }
        spawnEnemies([
            { name: "ウッドエルフ", hp: 90, atk: 18, exp: 40, gold: 30, color: "#16a085", size: 20 },
            { name: "毒キノコ", hp: 70, atk: 16, exp: 35, gold: 22, color: "#8e44ad", size: 18 }
        ], 5);
    }
    else if(mapName === "aquaris") {
        transitions.push({ x: 380, y: 440, w: 40, h: 30, name: "world", color: "#f39c12", label: "フィールドへ", targetX: 650, targetY: 310 });
        
        if(!p.orbs.water) {
            enemies.push({ x: 400, y: 120, name: "🌊 嵐竜ヴァルザー (BOSS)", hp: 450, maxHp: 450, atk: 28, exp: 250, gold: 350, color: "#2980b9", size: 40, isBoss: true, orb: "water" });
        }
        spawnEnemies([
            { name: "ディープシャーク", hp: 120, atk: 22, exp: 55, gold: 40, color: "#34495e", size: 22 },
            { name: "クラーケンクロー", hp: 100, atk: 20, exp: 50, gold: 35, color: "#2980b9", size: 20 }
        ], 5);
    }
    else if(mapName === "granval") {
        transitions.push({ x: 380, y: 440, w: 40, h: 30, name: "world", color: "#f39c12", label: "フィールドへ", targetX: 130, targetY: 310 });
        
        if(!p.orbs.shadow) {
            enemies.push({ x: 400, y: 120, name: "💀 冥将ゼノス (BOSS)", hp: 600, maxHp: 600, atk: 35, exp: 350, gold: 500, color: "#8e44ad", size: 40, isBoss: true, orb: "shadow" });
        }
        spawnEnemies([
            { name: "アイスナイト", hp: 160, atk: 28, exp: 70, gold: 50, color: "#bdc3c7", size: 24 },
            { name: "シャドウソウル", hp: 130, atk: 30, exp: 65, gold: 45, color: "#2c3e50", size: 18 }
        ], 5);
    }
    else if(mapName === "demon_castle") {
        transitions.push({ x: 380, y: 440, w: 40, h: 30, name: "world", color: "#f39c12", label: "退却", targetX: 390, targetY: 100 });
        
        const orbCount = Object.values(p.orbs).filter(Boolean).length;
        if(orbCount < 4) {
            addLog("⚠️ 魔王城の強力な結界に阻まれた！ 4つの宝珠を集めてから来よう！");
        } else {
            enemies.push({ x: 400, y: 120, name: "👑 最終魔王ルシフェル (FINAL BOSS)", hp: 1200, maxHp: 1200, atk: 45, exp: 1000, gold: 1000, color: "#e74c3c", size: 50, isBoss: true, isFinalBoss: true });
        }
    }

    updateUI();
}

function spawnEnemies(types, count) {
    for(let i=0; i<count; i++) {
        const type = types[Math.floor(Math.random() * types.length)];
        enemies.push({
            x: Math.random() * 700 + 50,
            y: Math.random() * 300 + 80,
            name: type.name,
            hp: type.hp, maxHp: type.hp,
            atk: type.atk,
            exp: type.exp,
            gold: type.gold,
            color: type.color,
            size: type.size,
            vx: (Math.random() - 0.5) * 1.5,
            vy: (Math.random() - 0.5) * 1.5
        });
    }
}

// Player Attack
function playerAttack() {
    if(p.isAttacking) return;
    p.isAttacking = true;
    p.attackTimer = 12;

    // Calc attack rect
    const range = 35;
    let ax = p.x + p.dirX * range - 15;
    let ay = p.y + p.dirY * range - 15;
    p.attackRect = { x: ax, y: ay, w: 30, h: 30 };

    // Hit test with enemies
    enemies.forEach((enemy, idx) => {
        if(checkOverlap({x: ax, y: ay, size: 30}, enemy)) {
            const dmg = p.atk + Math.floor(Math.random() * 6);
            enemy.hp -= dmg;
            createParticles(enemy.x, enemy.y, '#e74c3c', 8);
            addLog(`⚔️ ${enemy.name} に ${dmg} ダメージ与えた！`);

            if(enemy.hp <= 0) {
                p.exp += enemy.exp;
                p.gold += enemy.gold;
                addLog(`✨ ${enemy.name} を倒した！ (+${enemy.exp} EXP, +${enemy.gold} G)`);
                
                if(enemy.orb) {
                    p.orbs[enemy.orb] = true;
                    addLog(`🌟 **【${enemy.name}】を撃破し、宝珠を手に入れた！**`);
                }
                
                if(enemy.isFinalBoss) {
                    addLog("🎊 **魔王を撃破した！世界に光が戻った！【GAME CLEAR】**");
                    alert("🎉 GAME CLEAR! 魔王を倒して世界を救いました！");
                }

                enemies.splice(idx, 1);
                checkLevelUp();
                updateUI();
            }
        }
    });
}

function checkOverlap(a, b) {
    const dist = Math.hypot((a.x || a.x + a.size/2) - b.x, (a.y || a.y + a.size/2) - b.y);
    return dist < (a.size || 20) + (b.size || 20);
}

function createParticles(x, y, color, count) {
    for(let i=0; i<count; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 4,
            vy: (Math.random() - 0.5) * 4,
            life: 15,
            color: color
        });
    }
}

// Update Loop
function update() {
    // Movement
    let dx = 0, dy = 0;
    if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
    if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) dx += 1;

    if (dx !== 0 || dy !== 0) {
        const len = Math.hypot(dx, dy);
        p.dirX = dx / len;
        p.dirY = dy / len;
        p.x += (dx / len) * p.speed;
        p.y += (dy / len) * p.speed;

        // Boundaries
        p.x = Math.max(20, Math.min(780, p.x));
        p.y = Math.max(20, Math.min(460, p.y));
    }

    // Timers
    if(p.isAttacking) {
        p.attackTimer--;
        if(p.attackTimer <= 0) p.isAttacking = false;
    }
    if(p.invincibleTimer > 0) p.invincibleTimer--;

    // Move Enemies & Hit Player
    enemies.forEach(enemy => {
        enemy.x += enemy.vx;
        enemy.y += enemy.vy;

        if(enemy.x < 30 || enemy.x > 770) enemy.vx *= -1;
        if(enemy.y < 30 || enemy.y > 450) enemy.vy *= -1;

        // Enemy hits player
        if(p.invincibleTimer === 0 && checkOverlap(p, enemy)) {
            const dmg = Math.max(1, enemy.atk - Math.floor(p.lv * 1.5));
            p.hp -= dmg;
            p.invincibleTimer = 30; // 0.5 sec invincible
            createParticles(p.x, p.y, '#ff0000', 10);
            addLog(`💥 ${enemy.name} から ${dmg} のダメージを受けた！`);
            updateUI();

            if(p.hp <= 0) {
                alert("💀 あなたは倒れてしまった… ルミナス村で復活します。");
                p.hp = p.maxHp;
                loadMap("town_luminous", 400, 240);
            }
        }
    });

    // Check Transitions
    transitions.forEach(t => {
        if(Math.abs(p.x - (t.x + t.w/2)) < t.w/2 && Math.abs(p.y - (t.y + t.h/2)) < t.h/2) {
            loadMap(t.name, t.targetX || 400, t.targetY || 240);
        }
    });

    // Check NPCs (Town interactions)
    npcs.forEach(npc => {
        if(Math.hypot(p.x - npc.x, p.y - npc.y) < 30) {
            addLog(npc.text);
            if(npc.type === "inn") {
                p.hp = p.maxHp;
                updateUI();
            } else if(npc.type === "smith") {
                if(p.gold >= 100) {
                    p.gold -= 100;
                    p.atk += 10;
                    addLog("⚔️ 鍛冶屋に武器を鍛えてもらった！ (攻撃力+10)");
                    updateUI();
                }
            }
        }
    });

    // Update Particles
    particles.forEach((pt, i) => {
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.life--;
        if(pt.life <= 0) particles.splice(i, 1);
    });
}

// Render Loop
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw Background Map Style
    if(currentMap === "world") ctx.fillStyle = "#27ae60";
    else if(currentMap === "town_luminous") ctx.fillStyle = "#2d572c";
    else if(currentMap === "volcano") ctx.fillStyle = "#4a1c1d";
    else if(currentMap === "silphy") ctx.fillStyle = "#1e4d40";
    else if(currentMap === "aquaris") ctx.fillStyle = "#1b3b5a";
    else if(currentMap === "granval") ctx.fillStyle = "#3a3845";
    else if(currentMap === "demon_castle") ctx.fillStyle = "#2c1d38";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Draw Transitions / Buildings
    transitions.forEach(t => {
        ctx.fillStyle = t.color;
        ctx.fillRect(t.x, t.y, t.w, t.h);
        ctx.fillStyle = "#fff";
        ctx.font = "12px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(t.label, t.x + t.w/2, t.y - 5);
    });

    // Draw NPCs
    npcs.forEach(npc => {
        ctx.fillStyle = "#f1c40f";
        ctx.beginPath();
        ctx.arc(npc.x, npc.y, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.font = "12px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(npc.name, npc.x, npc.y - 15);
    });

    // Draw Enemies
    enemies.forEach(e => {
        ctx.fillStyle = e.color;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.size, 0, Math.PI * 2);
        ctx.fill();

        // HP bar for Bosses / Enemies
        ctx.fillStyle = "#333";
        ctx.fillRect(e.x - e.size, e.y - e.size - 8, e.size * 2, 5);
        ctx.fillStyle = "#e74c3c";
        ctx.fillRect(e.x - e.size, e.y - e.size - 8, (e.size * 2) * (e.hp / e.maxHp), 5);

        ctx.fillStyle = "#fff";
        ctx.font = "11px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(e.name, e.x, e.y - e.size - 12);
    });

    // Draw Player
    if(p.invincibleTimer % 4 < 2) { // Flashing when hurt
        ctx.fillStyle = "#f39c12";
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 2;
        ctx.stroke();

        // Player Direction Indicator
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(p.x + p.dirX * 12, p.y + p.dirY * 12, 4, 0, Math.PI * 2);
        ctx.fill();
    }

    // Draw Attack Swing
    if(p.isAttacking && p.attackRect) {
        ctx.fillStyle = "rgba(241, 196, 15, 0.6)";
        ctx.fillRect(p.attackRect.x, p.attackRect.y, p.attackRect.w, p.attackRect.h);
    }

    // Draw Particles
    particles.forEach(pt => {
        ctx.fillStyle = pt.color;
        ctx.fillRect(pt.x, pt.y, 3, 3);
    });
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

// Start Game
loadMap("world", 400, 240);
gameLoop();

</script>
</body>
