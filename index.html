<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <title>ソラゴンクエスト</title>

            user-select: none;

        }

            color: #fff;

        #game-wrapper {
            position: relative;
            background-color: #0f172a;
            border: 3px solid #38bdf8;
            border-radius: 12px;

        }
        .stat-group {

            align-items: center;
        }
        .val { color: #38bdf8; }
        .boss-flag { color: #f43f5e; font-weight: bold; }
        #controls-hint {
            margin-top: 8px;
            font-size: 12px;
            color: #94a3b8;
        }
        .key {
            background: #1e293b;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #0284c7;
            color: #38bdf8;
        }
    </style>
</head>
<body>

<div id="game-wrapper">
    <h1>⚔️ ソラゴンクエスト ⚔️</h1>
    <div id="canvas-container">
        <canvas id="gameCanvas" width="800" height="480"></canvas>
    </div>
    <div id="ui-bar">
        <div class="stat-group">
            <div>LV: <span id="ui-lv" class="val">1</span></div>
            <div>HP: <span id="ui-hp" class="val">120/120</span></div>
            <div>MP: <span id="ui-mp" class="val">50/50</span></div>
            <div>G: <span id="ui-gold" class="val">250</span></div>
            <div>薬: <span id="ui-potions" class="val">3</span></div>
        </div>
        <div class="stat-group">
            <div>四天王撃破: <span id="ui-cadre" class="boss-flag">0 / 4</span></div>
            <div>装備: <span id="ui-weapon" class="val" style="color:#fbbf24">鋼のロングソード</span></div>

    </div>
</div>

function spawnWildMonsters() {
    const mobTypes = [
        { name: "スライム", hp: 40, atk: 8, exp: 18, gold: 25, type: "slime", zone: "center" },
        { name: "野良ゴブリン", hp: 80, atk: 16, exp: 35, gold: 45, type: "goblin", zone: "wind" },
        { name: "荒野のオーク", hp: 140, atk: 26, exp: 70, gold: 80, type: "oak", zone: "water" },
        { name: "炎の魔物", hp: 210, atk: 38, exp: 120, gold: 140, type: "golem", zone: "fire" },
        { name: "雷光の巨人", hp: 310, atk: 50, exp: 190, gold: 220, type: "golem", zone: "thunder" }
    ];

    mobTypes.forEach(mob => {
        for (let i = 0; i < 8; i++) {
            let rx = 0, ry = 0;
            let validPos = false;
            let attempts = 0;

            while (!validPos && attempts < 200) {
                attempts++;
                if (mob.zone === "center") { rx = 1000 + Math.random() * 1600; ry = 1800 + Math.random() * 800; }
                else if (mob.zone === "wind") { rx = 200 + Math.random() * 1200; ry = 200 + Math.random() * 1000; }
                else if (mob.zone === "water") { rx = 2200 + Math.random() * 1200; ry = 200 + Math.random() * 1000; }
                else if (mob.zone === "fire") { rx = 200 + Math.random() * 1200; ry = 1200 + Math.random() * 1000; }
                else if (mob.zone === "thunder") { rx = 2200 + Math.random() * 1200; ry = 1200 + Math.random() * 1000; }

                if (!isInsideStructure(rx, ry, 80)) {
                    validPos = true;
                }
            }

            if (validPos) {
                enemies.push({
                    x: rx, y: ry, vx: 0, vy: 0, moveTimer: 0,
                    name: mob.name, hp: mob.hp, maxHp: mob.hp,
                    atk: mob.atk, exp: mob.exp, gold: mob.gold,
                    type: mob.type, size: 22, isWandering: true
                });
            }
        }
    });
}

initPlayer();
initEnemies();

const keys = {};

window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (gameState === "TITLE" && (e.code === 'Space' || e.code === 'Enter')) {
        initPlayer();
        initEnemies();
        gameState = "FIELD";
    } else if (gameState === "ENDING" && (e.code === 'Space' || e.code === 'Enter')) {
        gameState = "TITLE";
    } else if (gameState === "FIELD" && e.code === 'Space') {
        checkFieldInteraction();
    } else if (gameState === "DIALOGUE" && e.code === 'Space') {
        gameState = "FIELD";
    } else if (gameState === "SHOP") {
        handleShopInput(e.code);
    } else if (gameState === "INN" && e.code === 'Space') {
        executeInn();
    } else if (gameState === "BATTLE") {
        handleBattleInput(e.code);
    }
    updateUI();
});

window.addEventListener('keyup', e => { keys[e.code] = false; });

function getDefeatedCadreCount() {
    return Object.values(p.cadreDefeated).filter(Boolean).length;
}

function updateUI() {
    document.getElementById('ui-lv').innerText = p.lv;
    document.getElementById('ui-hp').innerText = `${Math.max(0, p.hp)}/${p.maxHp}`;
    document.getElementById('ui-mp').innerText = `${Math.max(0, p.mp)}/${p.maxMp}`;
    document.getElementById('ui-gold').innerText = p.gold;
    document.getElementById('ui-potions').innerText = p.potions;
    document.getElementById('ui-cadre').innerText = `${getDefeatedCadreCount()} / 4`;
    document.getElementById('ui-weapon').innerText = WEAPONS[p.equippedWeapon].name;

    const stateEl = document.getElementById('ui-state');
    if (gameState === "TITLE") { stateEl.innerText = "タイトル画面"; stateEl.style.color = "#fbbf24"; }
    else if (gameState === "FIELD") { stateEl.innerText = "フィールド探索"; stateEl.style.color = "#4ade80"; }
    else if (gameState === "DIALOGUE") { stateEl.innerText = "会話中"; stateEl.style.color = "#fbbf24"; }
    else if (gameState === "SHOP") { stateEl.innerText = "ショップ利用中"; stateEl.style.color = "#38bdf8"; }
    else if (gameState === "BATTLE") { stateEl.innerText = "ターン制バトル"; stateEl.style.color = "#f87171"; }
    else if (gameState === "ENDING") { stateEl.innerText = "エンディング"; stateEl.style.color = "#a855f7"; }
}

function checkCollisionWithWalls(nextX, nextY) {
    const wallThick = 14;

    for (let st of structures) {
        if (st.isDemonCastle && getDefeatedCadreCount() < 4) {
            if (nextX >= st.gateX - 20 && nextX <= st.gateX + st.gateW + 20 &&
                nextY >= st.y + st.h - 30 && nextY <= st.y + st.h + 20) {
                alert(`🛡️ 強大な紅蓮結界が阻んでいる！\n四天王（残り ${4 - getDefeatedCadreCount()} 人）をすべて討伐するまで魔王城の門は開かない！`);
                return true;
            }
        }

        if (circleRectOverlap(nextX, nextY, p.size, st.x, st.y, st.w, wallThick)) return true;
        if (circleRectOverlap(nextX, nextY, p.size, st.x, st.y, wallThick, st.h)) return true;
        if (circleRectOverlap(nextX, nextY, p.size, st.x + st.w - wallThick, st.y, wallThick, st.h)) return true;

        const leftSouthW = st.gateX - st.x;
        const rightSouthX = st.gateX + st.gateW;
        const rightSouthW = (st.x + st.w) - rightSouthX;

        if (leftSouthW > 0 && circleRectOverlap(nextX, nextY, p.size, st.x, st.y + st.h - wallThick, leftSouthW, wallThick)) return true;
        if (rightSouthW > 0 && circleRectOverlap(nextX, nextY, p.size, rightSouthX, st.y + st.h - wallThick, rightSouthW, wallThick)) return true;
    }
    return false;
}

function circleRectOverlap(cx, cy, r, rx, ry, rw, rh) {
    let closestX = Math.max(rx, Math.min(cx, rx + rw));
    let closestY = Math.max(ry, Math.min(cy, ry + rh));
    let distX = cx - closestX;
    let distY = cy - closestY;
    return (distX * distX + distY * distY) < (r * r);
}

function checkFieldInteraction() {
    for (let npc of npcs) {
        if (Math.hypot(p.x - npc.x, p.y - npc.y) < 45) {
            currentTarget = npc;
            if (npc.role === "SHOP_WEAPON") {
                gameState = "SHOP"; currentShopType = "WEAPON"; shopSelection = 0;
            } else if (npc.role === "SHOP_ITEM") {
                gameState = "SHOP"; currentShopType = "ITEM"; shopSelection = 0;
            } else if (npc.role === "INN") {
                gameState = "INN";
            } else {
                gameState = "DIALOGUE";
            }
            updateUI();
            return;
        }
    }

    for (let enemy of enemies) {
        if (Math.hypot(p.x - enemy.x, p.y - enemy.y) < 45) {
            if (enemy.isCadre) {
                const subLeft = enemies.filter(e => e.isSubCadre && e.parentCadre === enemy.isCadre).length;
                if (subLeft > 0) {
                    alert(`⚠️ 城内の配下（残り ${subLeft} 人）を討ち倒さなければ幹部【${enemy.name}】の部屋に入ることはできない！`);
                    return;
                }
            }
            if (enemy.isBoss && getDefeatedCadreCount() < 4) {
                alert(`🛡️ 強大な結界が阻んでいる！ 四天王（残り ${4 - getDefeatedCadreCount()} 人）を討伐しなければ魔王には挑めない！`);
                return;
            }
            startBattle(enemy);
            return;
        }
    }
}

function handleShopInput(code) {
    if (code === 'KeyW' || code === 'ArrowUp') shopSelection = Math.max(0, shopSelection - 1);
    if (code === 'KeyS' || code === 'ArrowDown') shopSelection++;

    if (currentShopType === "WEAPON") {
        const weaponKeys = Object.keys(WEAPONS);
        shopSelection = Math.min(weaponKeys.length - 1, shopSelection);
        if (code === 'Space') {
            const wKey = weaponKeys[shopSelection];
            const w = WEAPONS[wKey];
            if (p.inventory.includes(wKey)) {
                p.equippedWeapon = wKey;
                alert(`🗡️ 【${w.name}】を装備しました！`);
            } else if (p.gold >= w.price) {
                p.gold -= w.price;
                p.inventory.push(wKey);
                p.equippedWeapon = wKey;
                alert(`🛒 【${w.name}】を購入して装備しました！`);
            } else {
                alert("⚠️ ゴールドが足りません！");
            }
        }
    } else if (currentShopType === "ITEM") {
        shopSelection = 0;
        if (code === 'Space') {
            if (p.gold >= 50) {
                p.gold -= 50;
                p.potions++;
                alert("🧪 回復の薬を購入しました！ (HP 80回復)");
            } else {
                alert("⚠️ ゴールドが足りません！");
            }
        }
    }
    if (code === 'Escape') gameState = "FIELD";
    updateUI();
}

function executeInn() {
    if (p.gold >= 40) {
        p.gold -= 40;
        p.hp = p.maxHp;
        p.mp = p.maxMp;
        alert("🏨 宿屋で旅の疲れを完全に癒やした！ HPとMPが全回復！");
    } else {
        alert("⚠️ ゴールドが足りません！");
    }
    gameState = "FIELD";
    updateUI();
}

function startBattle(enemy) {
    currentTarget = enemy;
    gameState = "BATTLE";
    battleMenuMode = "MAIN";
    p.isGuarding = false;
    battleLog = `⚔️ ${enemy.name} が立ちはだかった！`;
    updateUI();
}

function handleBattleInput(code) {
    if (battleMenuMode === "MAIN") {
        if (code === 'Digit1') executePlayerAttack();
        else if (code === 'Digit2') battleMenuMode = "WEAPON_SELECT";
        else if (code === 'Digit3') battleMenuMode = "SKILL_SELECT";
        else if (code === 'Digit4') executePlayerGuard();
    } else if (battleMenuMode === "WEAPON_SELECT") {
        const weaponKeys = p.inventory;
        if (code === 'Digit1' && weaponKeys[0]) p.equippedWeapon = weaponKeys[0];
        if (code === 'Digit2' && weaponKeys[1]) p.equippedWeapon = weaponKeys[1];
        if (code === 'Digit3' && weaponKeys[2]) p.equippedWeapon = weaponKeys[2];
        if (code === 'Digit4' && weaponKeys[3]) p.equippedWeapon = weaponKeys[3];
        battleLog = `🗡️ 武器を【${WEAPONS[p.equippedWeapon].name}】に変更！`;
        battleMenuMode = "MAIN";
        updateUI();
    } else if (battleMenuMode === "SKILL_SELECT") {
        if (code === 'Digit1') executeSkill("heal");
        else if (code === 'Digit2') executeSkill("fire");
        else if (code === 'Digit3') executeSkill("item");
        else battleMenuMode = "MAIN";
    }
}

function executePlayerAttack() {
    const w = WEAPONS[p.equippedWeapon];
    const hit = Math.random() < w.hitRate;
    let isCrit = w.critRate && Math.random() < w.critRate;

    activeEffect = "SLASH";
    setTimeout(() => { activeEffect = null; }, 600);

    if (!hit) {
        battleLog = `⚔️ 攻撃を繰り出したが ${currentTarget.name} にかわされた！`;
    } else {
        let dmg = p.baseAtk + w.atk + Math.floor(Math.random() * 10);
        if (isCrit) dmg = Math.floor(dmg * 1.8);
        currentTarget.hp -= dmg;
        battleLog = `💥 ${w.name} の一撃！ ${currentTarget.name} に ${dmg} ダメージ！${isCrit ? " (会心の一撃！)" : ""}`;
    }

    if (checkBattleEnd()) return;
    setTimeout(enemyTurn, 1000);
}

function executePlayerGuard() {
    p.isGuarding = true;
    battleLog = "🛡️ 盾を構えてガード態勢を取った！ (被ダメージ半減)";
    setTimeout(enemyTurn, 1000);
}

function executeSkill(type) {
    if (type === "heal") {
        if (p.mp < 12) { battleLog = "⚠️ MPが足りない！"; return; }
        p.mp -= 12;
        p.hp = Math.min(p.maxHp, p.hp + 75);
        activeEffect = "HEAL";
        setTimeout(() => { activeEffect = null; }, 600);
        battleLog = "✨ 聖なる祈り！ HPが 75 回復！";
    } else if (type === "fire") {
        if (p.mp < 18) { battleLog = "⚠️ MPが足りない！"; return; }
        p.mp -= 18;
        const dmg = 110;
        currentTarget.hp -= dmg;
        activeEffect = "FIRE";
        setTimeout(() => { activeEffect = null; }, 600);
        battleLog = `🔥 爆炎呪文ヴォルカノ！ ${currentTarget.name} に ${dmg} ダメージ！`;
    } else if (type === "item") {
        if (p.potions <= 0) { battleLog = "⚠️ 回復の薬がない！"; return; }
        p.potions--;
        p.hp = Math.min(p.maxHp, p.hp + 80);
        activeEffect = "HEAL";
        setTimeout(() => { activeEffect = null; }, 600);
        battleLog = "🧪 回復の薬を使用！ HPが 80 回復！";
    }
    battleMenuMode = "MAIN";
    updateUI();
    if (checkBattleEnd()) return;
    setTimeout(enemyTurn, 1000);
}

function enemyTurn() {
    if (currentTarget.hp <= 0) return;
    let dmg = currentTarget.atk + Math.floor(Math.random() * 8);
    if (p.isGuarding) dmg = Math.floor(dmg * 0.5);

    p.hp -= dmg;
    p.isGuarding = false;
    activeEffect = "ENEMY_ATTACK";
    setTimeout(() => { activeEffect = null; }, 600);

    battleLog = `💥 ${currentTarget.name} の攻撃！ 勇者は ${dmg} ダメージを受けた！`;

    if (p.hp <= 0) {
        alert("💀 勇者は倒れてしまった… 王国ルミナスで復活します。");
        p.hp = p.maxHp;
        p.mp = p.maxMp;
        gameState = "FIELD";
        p.x = 1800; p.y = 2350;
    }
    updateUI();
}

function checkBattleEnd() {
    if (currentTarget.hp <= 0) {
        p.gold += currentTarget.gold;
        p.exp += currentTarget.exp;
        battleLog = `🎉 ${currentTarget.name} を討伐！ (+${currentTarget.exp} EXP, +${currentTarget.gold}G)`;

        if (currentTarget.isCadre) {
            p.cadreDefeated[currentTarget.isCadre] = true;
            alert(`🏆 四天王【${currentTarget.name}】を撃破！ (残り四天王: ${4 - getDefeatedCadreCount()} 人)`);
        } else if (currentTarget.isSubCadre) {
            const subLeft = enemies.filter(e => e.isSubCadre && e.parentCadre === currentTarget.parentCadre && e !== currentTarget).length;
            alert(`⚔️ 城の配下【${currentTarget.name}】を破った！ (残る配下: ${subLeft} 人)`);
        }

        if (p.exp >= p.expToNext) {
            p.lv++;
            p.maxHp += 30; p.hp = p.maxHp;
            p.maxMp += 12; p.mp = p.maxMp;
            p.baseAtk += 8;
            p.expToNext = Math.floor(p.expToNext * 1.5);
            alert(`🌟 LEVEL UP! LV ${p.lv} に上がった！ (最大HP/MP・攻撃力が上昇)`);
        }

        const isBossDefeated = currentTarget.isBoss;
        enemies = enemies.filter(e => e !== currentTarget);

        setTimeout(() => {
            if (isBossDefeated) {
                alert("🎊 終焉の魔王ルシフェルを打ち倒し、世界に平和を取り戻した！");
                endingScrollY = 0;
                gameState = "ENDING";
            } else {
                gameState = "FIELD";
            }
            updateUI();
        }, 1200);
        return true;
    }
    return false;
}

function update() {
    battleAnimTimer += 0.05;
    if (gameState !== "FIELD") return;

    let dx = 0, dy = 0;
    if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
    if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) dx += 1;

    if (dx !== 0 || dy !== 0) {
        const len = Math.hypot(dx, dy);
        p.dirX = dx / len; p.dirY = dy / len;
        let nextX = p.x + p.dirX * p.speed;
        let nextY = p.y + p.dirY * p.speed;

        if (!checkCollisionWithWalls(nextX, p.y)) {
            p.x = Math.max(20, Math.min(WORLD_WIDTH - 20, nextX));
        }
        if (!checkCollisionWithWalls(p.x, nextY)) {
            p.y = Math.max(20, Math.min(WORLD_HEIGHT - 20, nextY));
        }
    }

    enemies.forEach(e => {
        if (e.isWandering) {
            e.moveTimer--;
            if (e.moveTimer <= 0) {
                const angle = Math.random() * Math.PI * 2;
                const spd = 0.8 + Math.random() * 1.2;
                e.vx = Math.cos(angle) * spd;
                e.vy = Math.sin(angle) * spd;
                e.moveTimer = 40 + Math.floor(Math.random() * 80);
            }

            let nextX = e.x + e.vx;
            let nextY = e.y + e.vy;

            if (!isInsideStructure(nextX, e.y, 40)) {
                e.x = nextX;
            } else {
                e.vx = -e.vx;
            }

            if (!isInsideStructure(e.x, nextY, 40)) {
                e.y = nextY;
            } else {
                e.vy = -e.vy;
            }

            structures.forEach(st => {
                const margin = 45;
                if (e.x >= st.x - margin && e.x <= st.x + st.w + margin &&
                    e.y >= st.y - margin && e.y <= st.y + st.h + margin) {
                    if (e.x < st.x + st.w / 2) e.x = st.x - margin - 10;
                    else e.x = st.x + st.w + margin + 10;
                    e.vx = -e.vx;
                    e.vy = -e.vy;
                }
            });

            e.x = Math.max(100, Math.min(WORLD_WIDTH - 100, e.x));
            e.y = Math.max(100, Math.min(WORLD_HEIGHT - 100, e.y));
        }

        if (Math.hypot(p.x - e.x, p.y - e.y) < p.size + e.size) {
            if (e.isCadre) {
                const subLeft = enemies.filter(sub => sub.isSubCadre && sub.parentCadre === e.isCadre).length;
                if (subLeft > 0) {
                    alert(`⚠️ 配下が残り ${subLeft} 人いる！ 配下を全滅させねば幹部【${e.name}】に挑むことはできない！`);
                    p.y += 12;
                    return;
                }
            }
            if (e.isBoss && getDefeatedCadreCount() < 4) return;
            startBattle(e);
        }
    });

    camera.x = Math.max(0, Math.min(WORLD_WIDTH - camera.width, p.x - camera.width / 2));
    camera.y = Math.max(0, Math.min(WORLD_HEIGHT - camera.height, p.y - camera.height / 2));
}

function drawTitleView() {
    ctx.fillStyle = "#020617"; ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.textAlign = "center";

    // 豪華な背景グラデーション効果
    const grad = ctx.createRadialGradient(400, 240, 50, 400, 240, 400);
    grad.addColorStop(0, "rgba(30, 58, 138, 0.5)");
    grad.addColorStop(1, "rgba(2, 6, 23, 1)");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // タイトルロゴ
    ctx.fillStyle = "#fbbf24";
    ctx.font = "bold 44px sans-serif";
    ctx.shadowColor = "#f59e0b";
    ctx.shadowBlur = 18;
    ctx.fillText("ソラゴンクエスト", canvas.width / 2, 170);
    ctx.shadowBlur = 0;

    ctx.fillStyle = "#38bdf8";
    ctx.font = "bold 18px sans-serif";
    ctx.fillText("〜 結界に守られし村々と四天王の影 〜", canvas.width / 2, 220);

    // 点滅するスタートボタンメッセージ
    if (Math.floor(Date.now() / 500) % 2 === 0) {
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 20px sans-serif";
        ctx.fillText("PRESS SPACE TO START", canvas.width / 2, 330);
    }

    ctx.fillStyle = "#94a3b8";
    ctx.font = "13px sans-serif";
    ctx.fillText("【操作】 移動: WASD / 矢印  |  調べる・決定: SPACE  |  戦闘コマンド: 1, 2, 3, 4", canvas.width / 2, 420);

    ctx.restore();
}

function drawEndingView() {
    ctx.fillStyle = "#000000"; ctx.fillRect(0, 0, canvas.width, canvas.height);

    endingScrollY -= 0.8;

    ctx.save();
    ctx.textAlign = "center";

    const credits = [
        { text: "〜 FIN 〜", font: "bold 28px sans-serif", color: "#fbbf24", margin: 100 },
        { text: "ソラゴンクエスト", font: "bold 38px sans-serif", color: "#38bdf8", margin: 70 },
        { text: "四天王と魔王の脅威から世界は救われた", font: "16px sans-serif", color: "#e2e8f0", margin: 120 },

        { text: "= STAFF CREDITS =", font: "bold 22px sans-serif", color: "#fbbf24", margin: 60 },
        { text: "【 ディレクター & ゲームデザイン 】", font: "bold 14px sans-serif", color: "#94a3b8", margin: 25 },
        { text: "サマースカイ", font: "bold 26px sans-serif", color: "#ffffff", margin: 80 },

        { text: "【 AI 開発パートナー 】", font: "bold 14px sans-serif", color: "#94a3b8", margin: 25 },
        { text: "Gemini", font: "bold 26px sans-serif", color: "#38bdf8", margin: 100 },

        { text: "【 Special Thanks 】", font: "bold 14px sans-serif", color: "#94a3b8", margin: 25 },
        { text: "すべての冒険者たち", font: "bold 20px sans-serif", color: "#4ade80", margin: 140 },

        { text: "THANK YOU FOR PLAYING!", font: "bold 28px sans-serif", color: "#fbbf24", margin: 0 }
    ];

    let currentY = canvas.height + endingScrollY;

    credits.forEach(item => {
        if (currentY > -40 && currentY < canvas.height + 40) {
            ctx.font = item.font;
            ctx.fillStyle = item.color;
            ctx.fillText(item.text, canvas.width / 2, currentY);
        }
        currentY += item.margin;
    });

    ctx.restore();

    if (currentY < canvas.height / 2) {
        if (Math.floor(Date.now() / 500) % 2 === 0) {
            ctx.fillStyle = "#ffffff"; ctx.font = "bold 16px sans-serif"; ctx.textAlign = "center";
            ctx.fillText("PRESS SPACE TO RETURN TO TITLE", canvas.width / 2, 440);
        }
    }
}

function drawDetailedPlayer(ctx, scale = 1) {
    ctx.save();
    ctx.scale(scale, scale);

    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.beginPath(); ctx.ellipse(0, 14, 12, 5, 0, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = "#dc2626";
    ctx.beginPath(); ctx.moveTo(-10, -4); ctx.lineTo(-15, 16); ctx.lineTo(15, 16); ctx.lineTo(10, -4); ctx.closePath(); ctx.fill();

    ctx.fillStyle = "#1e40af"; ctx.fillRect(-8, -5, 16, 18);
    ctx.fillStyle = "#3b82f6"; ctx.beginPath(); ctx.arc(-11, 3, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#94a3b8"; ctx.fillRect(9, -10, 3, 18);

    ctx.fillStyle = "#ffedd5"; ctx.beginPath(); ctx.arc(0, -16, 10, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#0f172a"; ctx.beginPath(); ctx.arc(-3, -17, 1.5, 0, Math.PI * 2); ctx.arc(3, -17, 1.5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#b91c1c"; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(0, -13, 3, 0, Math.PI); ctx.stroke();

    ctx.fillStyle = "#f59e0b";
    ctx.beginPath();
    ctx.moveTo(-10, -18); ctx.lineTo(-6, -26); ctx.lineTo(-1, -20);
    ctx.lineTo(4, -28); ctx.lineTo(9, -18); ctx.closePath(); ctx.fill();

    ctx.restore();
}

function drawStructures() {
    structures.forEach(st => {
        ctx.fillStyle = st.color;
        ctx.fillRect(st.x, st.y, st.w, st.h);

        const wallThick = 14;
        ctx.fillStyle = st.wallColor;

        ctx.fillRect(st.x, st.y, st.w, wallThick);
        ctx.fillRect(st.x, st.y, wallThick, st.h);
        ctx.fillRect(st.x + st.w - wallThick, st.y, wallThick, st.h);

        const leftSouthW = st.gateX - st.x;
        const rightSouthX = st.gateX + st.gateW;
        const rightSouthW = (st.x + st.w) - rightSouthX;

        ctx.fillRect(st.x, st.y + st.h - wallThick, leftSouthW, wallThick);
        ctx.fillRect(rightSouthX, st.y + st.h - wallThick, rightSouthW, wallThick);

        ctx.fillStyle = "#fbbf24";
        ctx.fillRect(st.gateX - 2, st.y + st.h - wallThick - 2, 4, wallThick + 4);
        ctx.fillRect(st.gateX + st.gateW - 2, st.y + st.h - wallThick - 2, 4, wallThick + 4);

        ctx.fillStyle = "#fff"; ctx.font = "bold 14px sans-serif"; ctx.textAlign = "center";
        ctx.fillText(`【 ${st.name} 】`, st.x + st.w / 2, st.y - 8);

        if (st.isDemonCastle && getDefeatedCadreCount() < 4) {
            ctx.fillStyle = "rgba(244, 63, 94, 0.4)";
            ctx.fillRect(st.gateX, st.y + st.h - wallThick, st.gateW, wallThick);
            ctx.fillStyle = "#f43f5e"; ctx.font = "bold 12px sans-serif";
            ctx.fillText("🚫 結界閉鎖中", st.gateX + st.gateW / 2, st.y + st.h + 15);
        }
    });
}

function drawField() {
    ctx.save();
    ctx.translate(-camera.x, -camera.y);

    ctx.fillStyle = "#15803d"; ctx.fillRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);

    ctx.fillStyle = "rgba(6, 182, 212, 0.15)"; ctx.fillRect(2000, 0, 1600, 1000);
    ctx.fillStyle = "rgba(239, 68, 68, 0.15)"; ctx.fillRect(0, 1000, 1600, 1000);
    ctx.fillStyle = "rgba(234, 179, 8, 0.15)"; ctx.fillRect(2000, 1000, 1600, 1000);

    ctx.strokeStyle = "#d97706"; ctx.lineWidth = 28; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(1800, 2000); ctx.lineTo(1800, 550);
    ctx.moveTo(1800, 800); ctx.lineTo(400, 800); ctx.lineTo(400, 470);
    ctx.moveTo(1800, 800); ctx.lineTo(3100, 800); ctx.lineTo(3100, 470);
    ctx.moveTo(1800, 1800); ctx.lineTo(400, 1800); ctx.lineTo(400, 1470);
    ctx.moveTo(1800, 1800); ctx.lineTo(3100, 1800); ctx.lineTo(3100, 1470);
    ctx.stroke();

    drawStructures();

    npcs.forEach(npc => {
        ctx.save(); ctx.translate(npc.x, npc.y);
        drawNPC(ctx, npc.type);
        ctx.restore();
        ctx.fillStyle = "#fff"; ctx.font = "bold 12px sans-serif"; ctx.textAlign = "center";
        ctx.fillText(npc.name, npc.x, npc.y - 20);
    });

    enemies.forEach(e => {
        ctx.save(); ctx.translate(e.x, e.y);
        drawCadre(ctx, e.type, e.isBoss ? 1.0 : e.isSubCadre ? 0.75 : 0.85);
        ctx.restore();
        ctx.fillStyle = "#fff"; ctx.font = "bold 11px sans-serif"; ctx.textAlign = "center";
        ctx.fillText(e.name, e.x, e.y - (e.size || 20) - 6);
    });

    ctx.save(); ctx.translate(p.x, p.y);
    drawDetailedPlayer(ctx, 0.95);
    ctx.restore();

    ctx.restore();
}

function drawNPC(ctx, type) {
    if (type === "king") { ctx.fillStyle = "#eab308"; }
    else if (type === "merchant") { ctx.fillStyle = "#0284c7"; }
    else if (type === "inn") { ctx.fillStyle = "#16a34a"; }
    else { ctx.fillStyle = "#ec4899"; }
    ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(-3, -2, 2.5, 0, Math.PI*2); ctx.arc(3, -2, 2.5, 0, Math.PI*2); ctx.fill();
}

function drawCadre(ctx, type, scale = 1) {
    ctx.save();
    ctx.scale(scale, scale);

    if (type === "slime") {
        ctx.fillStyle = "rgba(0, 0, 0, 0.2)";
        ctx.beginPath(); ctx.ellipse(0, 12, 14, 5, 0, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = "#06b6d4";
        ctx.beginPath();
        ctx.moveTo(0, -16);
        ctx.bezierCurveTo(16, -16, 20, 12, 16, 14);
        ctx.bezierCurveTo(8, 16, -8, 16, -16, 14);
        ctx.bezierCurveTo(-20, 12, -16, -16, 0, -16);
        ctx.fill();

        ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
        ctx.beginPath(); ctx.arc(-6, -6, 4, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = "#0f172a";
        ctx.beginPath(); ctx.arc(-5, 2, 2.5, 0, Math.PI * 2); ctx.arc(5, 2, 2.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.beginPath(); ctx.arc(-6, 1, 1, 0, Math.PI * 2); ctx.arc(4, 1, 1, 0, Math.PI * 2); ctx.fill();

        ctx.strokeStyle = "#0891b2"; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(0, 4, 3, 0.1, Math.PI - 0.1); ctx.stroke();

    } else if (type === "goblin") {
        ctx.fillStyle = "#15803d";
        ctx.beginPath(); ctx.moveTo(-8, -4); ctx.lineTo(-20, -8); ctx.lineTo(-10, 4); ctx.fill();
        ctx.beginPath(); ctx.moveTo(8, -4); ctx.lineTo(20, -8); ctx.lineTo(10, 4); ctx.fill();

        ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = "#ef4444";
        ctx.beginPath(); ctx.arc(-4, -2, 3, 0, Math.PI * 2); ctx.arc(4, -2, 3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#fbbf24";
        ctx.beginPath(); ctx.arc(-4, -2, 1, 0, Math.PI * 2); ctx.arc(4, -2, 1, 0, Math.PI * 2); ctx.fill();

        ctx.strokeStyle = "#052e16"; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(-6, 5); ctx.lineTo(6, 5); ctx.stroke();
        ctx.fillStyle = "#fff";
        ctx.beginPath(); ctx.moveTo(-4, 5); ctx.lineTo(-3, 2); ctx.lineTo(-2, 5); ctx.fill();
        ctx.beginPath(); ctx.moveTo(2, 5); ctx.lineTo(3, 2); ctx.lineTo(4, 5); ctx.fill();

    } else if (type === "oak") {
        ctx.fillStyle = "#78350f"; ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#451a03"; ctx.fillRect(-12, -8, 24, 6);

        ctx.fillStyle = "#f87171";
        ctx.beginPath(); ctx.arc(-6, -2, 2.5, 0, Math.PI * 2); ctx.arc(6, -2, 2.5, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = "#fef3c7";
        ctx.beginPath(); ctx.moveTo(-8, 8); ctx.lineTo(-6, 0); ctx.lineTo(-4, 8); ctx.fill();
        ctx.beginPath(); ctx.moveTo(4, 8); ctx.lineTo(6, 0); ctx.lineTo(8, 8); ctx.fill();

    } else if (type === "golem") {
        ctx.fillStyle = "#334155";
        ctx.fillRect(-16, -16, 32, 32);
        ctx.strokeStyle = "#64748b"; ctx.lineWidth = 2;
        ctx.strokeRect(-16, -16, 32, 32);

        ctx.beginPath(); ctx.moveTo(-10, -10); ctx.lineTo(-2, -4); ctx.lineTo(-6, 6); ctx.stroke();

        ctx.fillStyle = "#38bdf8"; ctx.shadowColor = "#38bdf8"; ctx.shadowBlur = 8;
        ctx.fillRect(-8, -6, 16, 4);
        ctx.shadowBlur = 0;

    } else if (type.startsWith("sub_")) {
        let color = "#94a3b8";
        if (type === "sub_wind") color = "#10b981";
        if (type === "sub_water") color = "#06b6d4";
        if (type === "sub_fire") color = "#f97316";
        if (type === "sub_thunder") color = "#eab308";

        ctx.fillStyle = "#1e293b"; ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = color; ctx.fillRect(-12, -4, 24, 6);
        ctx.fillStyle = "#fff"; ctx.fillRect(-3, -2, 6, 2);

    } else if (type === "cadre_wind") {
        ctx.fillStyle = "#059669";
        ctx.beginPath(); ctx.moveTo(0, -32); ctx.lineTo(-18, -10); ctx.lineTo(18, -10); ctx.closePath(); ctx.fill();

        ctx.fillStyle = "#10b981"; ctx.beginPath(); ctx.ellipse(0, 0, 18, 22, 0, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = "#a7f3d0";
        ctx.beginPath(); ctx.moveTo(-16, -8); ctx.lineTo(-28, -20); ctx.lineTo(-14, -2); ctx.fill();
        ctx.beginPath(); ctx.moveTo(16, -8); ctx.lineTo(28, -20); ctx.lineTo(14, -2); ctx.fill();

        ctx.fillStyle = "#064e3b"; ctx.fillRect(-10, -4, 20, 6);
        ctx.fillStyle = "#34d399"; ctx.beginPath(); ctx.arc(-5, -1, 2, 0, Math.PI * 2); ctx.arc(5, -1, 2, 0, Math.PI * 2); ctx.fill();

    } else if (type === "cadre_water") {
        ctx.fillStyle = "#38bdf8";
        ctx.beginPath(); ctx.moveTo(-20, 10); ctx.lineTo(-22, -22); ctx.lineTo(0, -12); ctx.lineTo(22, -22); ctx.lineTo(20, 10); ctx.fill();

        ctx.fillStyle = "#bae6fd"; ctx.beginPath(); ctx.arc(0, -2, 15, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = "#0284c7";
        ctx.beginPath(); ctx.moveTo(-10, -14); ctx.lineTo(0, -26); ctx.lineTo(10, -14); ctx.fill();

        ctx.fillStyle = "#0369a1"; ctx.beginPath(); ctx.arc(-5, -2, 2.5, 0, Math.PI * 2); ctx.arc(5, -2, 2.5, 0, Math.PI * 2); ctx.fill();

    } else if (type === "cadre_fire") {
        ctx.fillStyle = "#ef4444";
        ctx.beginPath();
        ctx.moveTo(0, -36); ctx.lineTo(12, -18); ctx.lineTo(22, -30); ctx.lineTo(16, 0);
        ctx.lineTo(-16, 0); ctx.lineTo(-22, -30); ctx.lineTo(-12, -18); ctx.closePath(); ctx.fill();

        ctx.fillStyle = "#7f1d1d"; ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = "#18181b";
        ctx.beginPath(); ctx.moveTo(-12, -10); ctx.lineTo(-26, -26); ctx.lineTo(-8, -16); ctx.fill();
        ctx.beginPath(); ctx.moveTo(12, -10); ctx.lineTo(26, -26); ctx.lineTo(8, -16); ctx.fill();

        ctx.fillStyle = "#fbbf24"; ctx.beginPath(); ctx.arc(-6, -2, 3, 0, Math.PI * 2); ctx.arc(6, -2, 3, 0, Math.PI * 2); ctx.fill();

    } else if (type === "cadre_thunder") {
        ctx.fillStyle = "#eab308";
        ctx.beginPath(); ctx.moveTo(-16, -14); ctx.lineTo(-8, -32); ctx.lineTo(0, -18); ctx.lineTo(8, -32); ctx.lineTo(16, -14); ctx.fill();

        ctx.fillStyle = "#713f12"; ctx.beginPath(); ctx.arc(0, -2, 17, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = "#f8fafc";
        ctx.beginPath(); ctx.moveTo(-14, 2); ctx.lineTo(0, 22); ctx.lineTo(14, 2); ctx.fill();

        ctx.fillStyle = "#fef08a"; ctx.shadowColor = "#fef08a"; ctx.shadowBlur = 6;
        ctx.beginPath(); ctx.arc(-5, -4, 3, 0, Math.PI * 2); ctx.arc(5, -4, 3, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;

    } else if (type === "lucifel") {
        ctx.fillStyle = "rgba(88, 28, 135, 0.4)"; ctx.shadowColor = "#a855f7"; ctx.shadowBlur = 20;
        ctx.beginPath(); ctx.arc(0, 0, 36, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;

        ctx.fillStyle = "#2e1065"; ctx.beginPath(); ctx.arc(0, 0, 28, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = "#0f172a";
        ctx.beginPath(); ctx.moveTo(-15, -15); ctx.lineTo(-38, -38); ctx.lineTo(-8, -24); ctx.fill();
        ctx.beginPath(); ctx.moveTo(15, -15); ctx.lineTo(38, -38); ctx.lineTo(8, -24); ctx.fill();
        ctx.beginPath(); ctx.moveTo(-20, -5); ctx.lineTo(-44, -18); ctx.lineTo(-16, -12); ctx.fill();
        ctx.beginPath(); ctx.moveTo(20, -5); ctx.lineTo(44, -18); ctx.lineTo(16, -12); ctx.fill();

        ctx.fillStyle = "#dc2626"; ctx.shadowColor = "#ef4444"; ctx.shadowBlur = 8;
        ctx.beginPath(); ctx.arc(-10, -8, 3, 0, Math.PI * 2); ctx.arc(10, -8, 3, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(-14, 2, 2.5, 0, Math.PI * 2); ctx.arc(14, 2, 2.5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(-6, 4, 2.5, 0, Math.PI * 2); ctx.arc(6, 4, 2.5, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = "#fbbf24";
        ctx.beginPath(); ctx.arc(0, -14, 4, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#000";
        ctx.beginPath(); ctx.arc(0, -14, 1.5, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
    }

    ctx.restore();
}

function drawShopView() {
    ctx.fillStyle = "#0f172a"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#fbbf24"; ctx.font = "bold 20px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(currentShopType === "WEAPON" ? "⚔️ 王立鍛冶屋 🛒" : "🧪 道具屋 🛒", canvas.width / 2, 50);

    ctx.fillStyle = "#94a3b8"; ctx.font = "14px sans-serif";
    ctx.fillText(`所持金: ${p.gold} G   [W/S] 選択  [SPACE] 購入・装備  [ESC] 戻る`, canvas.width / 2, 85);

    if (currentShopType === "WEAPON") {
        const weaponKeys = Object.keys(WEAPONS);
        weaponKeys.forEach((key, idx) => {
            const w = WEAPONS[key];
            const isOwned = p.inventory.includes(key);
            const isEquipped = p.equippedWeapon === key;

            const y = 125 + idx * 62;
            ctx.fillStyle = (idx === shopSelection) ? "#1e293b" : "#020617";
            ctx.strokeStyle = (idx === shopSelection) ? "#fbbf24" : "#0284c7";
            ctx.lineWidth = 2;
            ctx.fillRect(100, y, 600, 52); ctx.strokeRect(100, y, 600, 52);

            ctx.fillStyle = isEquipped ? "#4ade80" : isOwned ? "#38bdf8" : "#fff";
            ctx.font = "bold 16px sans-serif"; ctx.textAlign = "left";
            ctx.fillText(`${w.name} (攻撃+${w.atk})`, 120, y + 32);

            ctx.fillStyle = "#fbbf24"; ctx.textAlign = "right";
            ctx.fillText(isEquipped ? "【装備中】" : isOwned ? "【所持】" : `${w.price} G`, 680, y + 32);
        });
    } else {
        ctx.fillStyle = "#1e293b"; ctx.strokeStyle = "#fbbf24"; ctx.lineWidth = 2;
        ctx.fillRect(100, 150, 600, 80); ctx.strokeRect(100, 150, 600, 80);
        ctx.fillStyle = "#fff"; ctx.font = "bold 18px sans-serif"; ctx.textAlign = "left";
        ctx.fillText("🧪 回復の薬 (HP 80回復)", 130, 195);
        ctx.fillStyle = "#fbbf24"; ctx.textAlign = "right";
        ctx.fillText("50 G", 670, 195);
    }
}

function drawDialogueView() {
    ctx.fillStyle = "#0f172a"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "rgba(15, 23, 42, 0.95)"; ctx.strokeStyle = "#fbbf24"; ctx.lineWidth = 3;
    ctx.fillRect(40, 310, 720, 130); ctx.strokeRect(40, 310, 720, 130);

    ctx.fillStyle = "#fbbf24"; ctx.font = "bold 18px sans-serif"; ctx.textAlign = "left";
    ctx.fillText(`【 ${currentTarget.name} 】`, 60, 345);
    ctx.fillStyle = "#fff"; ctx.font = "15px sans-serif";
    ctx.fillText(currentTarget.text, 60, 385);
}

function drawBattleView() {
    ctx.fillStyle = "#020617"; ctx.fillRect(0, 0, canvas.width, 220);
    ctx.fillStyle = "#14532d";
    ctx.beginPath(); ctx.moveTo(80, 170); ctx.lineTo(720, 170); ctx.lineTo(800, 340); ctx.lineTo(0, 340); ctx.closePath(); ctx.fill();

    ctx.save();
    const enemyX = 560 + Math.sin(battleAnimTimer * 2) * 5;
    const enemyY = 175;
    ctx.translate(enemyX, enemyY);
    drawCadre(ctx, currentTarget.type, currentTarget.isBoss ? 2.2 : currentTarget.isSubCadre ? 1.4 : 1.7);
    ctx.restore();

    ctx.save();
    const heroX = 220, heroY = 270;
    ctx.translate(heroX, heroY);
    drawDetailedPlayer(ctx, 1.8);
    ctx.restore();

    if (activeEffect === "SLASH") {
        ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.moveTo(enemyX - 40, enemyY - 40); ctx.lineTo(enemyX + 40, enemyY + 40); ctx.stroke();
    } else if (activeEffect === "FIRE") {
        ctx.fillStyle = "rgba(249, 115, 22, 0.6)";
        ctx.beginPath(); ctx.arc(enemyX, enemyY, 65, 0, Math.PI * 2); ctx.fill();
    } else if (activeEffect === "HEAL") {
        ctx.fillStyle = "rgba(74, 222, 128, 0.5)";
        ctx.beginPath(); ctx.arc(heroX, heroY - 20, 55, 0, Math.PI * 2); ctx.fill();
    }

    ctx.fillStyle = "rgba(15, 23, 42, 0.85)"; ctx.fillRect(40, 20, 280, 60);
    ctx.fillStyle = "#fff"; ctx.font = "bold 15px sans-serif"; ctx.textAlign = "left";
    ctx.fillText(currentTarget.name, 55, 42);
    ctx.fillStyle = "#1e293b"; ctx.fillRect(55, 52, 240, 12);
    ctx.fillStyle = "#ef4444"; ctx.fillRect(55, 52, 240 * Math.max(0, currentTarget.hp / currentTarget.maxHp), 12);

    ctx.fillStyle = "rgba(15, 23, 42, 0.85)"; ctx.fillRect(480, 210, 280, 65);
    ctx.fillStyle = "#fbbf24"; ctx.font = "bold 15px sans-serif";
    ctx.fillText(`勇者 (LV ${p.lv})`, 495, 232);
    ctx.fillStyle = "#1e293b"; ctx.fillRect(495, 242, 250, 10);
    ctx.fillStyle = "#4ade80"; ctx.fillRect(495, 242, 250 * Math.max(0, p.hp / p.maxHp), 10);
    ctx.fillStyle = "#38bdf8"; ctx.font = "bold 12px sans-serif";
    ctx.fillText(`HP: ${p.hp}/${p.maxHp}  MP: ${p.mp}/${p.maxMp}`, 495, 266);

    ctx.fillStyle = "rgba(15, 23, 42, 0.95)"; ctx.fillRect(30, 285, 740, 45);
    ctx.fillStyle = "#38bdf8"; ctx.font = "14px sans-serif"; ctx.fillText(battleLog, 45, 312);

    ctx.fillStyle = "rgba(15, 23, 42, 0.95)"; ctx.fillRect(30, 340, 740, 125);
    if (battleMenuMode === "MAIN") {
        drawMenuButton("1. 武器攻撃", 60, 360, 320, 40, "#38bdf8");
        drawMenuButton("2. 武器換装", 420, 360, 320, 40, "#fbbf24");
        drawMenuButton("3. 魔法・道具", 60, 410, 320, 40, "#a855f7");
        drawMenuButton("4. 防御", 420, 410, 320, 40, "#4ade80");
    } else if (battleMenuMode === "WEAPON_SELECT") {
        const inv = p.inventory;
        drawMenuButton(`1. ${WEAPONS[inv[0]] ? WEAPONS[inv[0]].name : '-'}`, 60, 360, 320, 40, "#38bdf8");
        drawMenuButton(`2. ${WEAPONS[inv[1]] ? WEAPONS[inv[1]].name : '-'}`, 420, 360, 320, 40, "#38bdf8");
        drawMenuButton(`3. ${WEAPONS[inv[2]] ? WEAPONS[inv[2]].name : '-'}`, 60, 410, 320, 40, "#38bdf8");
        drawMenuButton(`4. ${WEAPONS[inv[3]] ? WEAPONS[inv[3]].name : '-'}`, 420, 410, 320, 40, "#38bdf8");
    } else if (battleMenuMode === "SKILL_SELECT") {
        drawMenuButton("1. 回復祈り (12 MP)", 60, 360, 320, 40, "#a855f7");
        drawMenuButton("2. 爆炎呪文 (18 MP)", 420, 360, 320, 40, "#a855f7");
        drawMenuButton(`3. 回復の薬 (${p.potions}個)`, 60, 410, 320, 40, "#4ade80");
    }
}

function drawMenuButton(text, x, y, w, h, color) {
    ctx.fillStyle = "#1e293b"; ctx.strokeStyle = color; ctx.lineWidth = 2;
    ctx.fillRect(x, y, w, h); ctx.strokeRect(x, y, w, h);
    ctx.fillStyle = color; ctx.font = "bold 14px sans-serif"; ctx.textAlign = "left";
    ctx.fillText(text, x + 15, y + 25);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (gameState === "TITLE") drawTitleView();
    else if (gameState === "FIELD") drawField();
    else if (gameState === "DIALOGUE" || gameState === "INN") drawDialogueView();
    else if (gameState === "SHOP") drawShopView();
    else if (gameState === "BATTLE") drawBattleView();
    else if (gameState === "ENDING") drawEndingView();
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

updateUI();
gameLoop();

</script>
</body>
</html>
