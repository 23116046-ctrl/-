<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ソラゴンクエスト</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            color: #fff;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        canvas {
            border: 4px solid #fff;
            background-color: #000;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }
        .instructions {
            margin-top: 10px;
            text-align: center;
            font-size: 14px;
            color: #ccc;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="800" height="600"></canvas>
<div class="instructions">
    [移動]: WASD / 矢印キー | [決定・話す]: SPACE | [セーブ]: S | [ロード]: L<br>
    [戦闘コマンド]: 1:攻撃 | 2:武器換装 | 3:魔法・道具 | 4:防御
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- ゲーム状態定義 ---
const STATE_TITLE = 0;
const STATE_FIELD = 1;
const STATE_BATTLE = 2;
const STATE_TALK = 3;
const STATE_ENDING = 4;

let gameState = STATE_TITLE;

// --- マップ・カメラ設定 ---
const MAP_WIDTH = 3600;
const MAP_HEIGHT = 2800;
const TILE_SIZE = 40;

// --- プレイヤーデータ ---
const player = {
    x: 400,
    y: 400,
    speed: 4,
    size: 32,
    level: 1,
    hp: 50,
    maxHp: 50,
    mp: 20,
    maxMp: 20,
    atk: 12,
    def: 5,
    exp: 0,
    nextExp: 20,
    gold: 100,
    potions: 3,
    weaponIndex: 0,
    defeatedBosses: 0 // 倒した四天王の数 (4で結界解除)
};

// 武器リスト
const weapons = [
    { name: "銅の剣", atk: 5 },
    { name: "鉄の剣", atk: 12 },
    { name: "鋼の剣", atk: 22 },
    { name: "炎の聖剣", atk: 35 },
    { name: "竜王の光剣", atk: 50 }
];

// --- 敵・NPCデータ ---
const bosses = [
    { id: 0, name: "風の四天王シルフ", x: 800, y: 600, hp: 80, maxHp: 80, atk: 15, exp: 50, gold: 100, defeated: false, color: "#88ff88" },
    { id: 1, name: "水の四天王ウンディーネ", x: 2800, y: 500, hp: 120, maxHp: 120, atk: 22, exp: 100, gold: 200, defeated: false, color: "#8888ff" },
    { id: 2, name: "炎の四天王サラマンダー", x: 600, y: 2200, hp: 180, maxHp: 180, atk: 32, exp: 200, gold: 400, defeated: false, color: "#ff4444" },
    { id: 3, name: "雷の四天王ヴォルテックス", x: 3000, y: 2200, hp: 250, maxHp: 250, atk: 45, exp: 400, gold: 800, defeated: false, color: "#ffff44" }
];

const demonKing = {
    name: "終焉の魔王ルシフェル",
    x: 1800,
    y: 300,
    hp: 600,
    maxHp: 600,
    atk: 65,
    exp: 9999,
    gold: 9999,
    color: "#ff00ff"
};

// 結界の位置 (魔王城の前)
const barrier = { x: 1750, y: 500, width: 100, height: 40 };

// 街・NPC
const inn = { x: 400, y: 300, name: "宿屋 (50Gで全回復)" };
const shop = { x: 500, y: 300, name: "道具屋 (薬50G / 武器新調)" };

// --- 会話・メッセージ管理 ---
let messageQueue = [];
let messageIndex = 0;

// --- 戦闘管理 ---
let currentEnemy = null;
let battleLog = "";
let isPlayerTurn = true;
let isDefending = false;

// --- キー入力判定 ---
const keys = {};

window.addEventListener('keydown', (e) => {
    keys[e.code] = true;

    // タイトル画面の決定
    if (gameState === STATE_TITLE && e.code === 'Space') {
        gameState = STATE_FIELD;
        return;
    }

    // 会話メッセージ送り処理（結界でのスタックを解消する重要箇所）
    if (gameState === STATE_TALK && e.code === 'Space') {
        messageIndex++;
        if (messageIndex >= messageQueue.length) {
            // メッセージ終了後、確実にフィールド探索状態へ完全復帰する
            gameState = STATE_FIELD;
            messageQueue = [];
            messageIndex = 0;
        }
        return;
    }

    // フィールドでのセーブ / ロード
    if (gameState === STATE_FIELD) {
        if (e.code === 'KeyS') saveGame();
        if (e.code === 'KeyL') loadGame();
    }

    // 戦闘コマンド選択
    if (gameState === STATE_BATTLE && isPlayerTurn) {
        if (e.code === 'Digit1') playerAttack();
        if (e.code === 'Digit2') switchWeapon();
        if (e.code === 'Digit3') useMagicOrItem();
        if (e.code === 'Digit4') playerDefend();
    }
});

window.addEventListener('keyup', (e) => {
    keys[e.code] = false;
});

// --- ダイアログ表示処理 ---
function showMessage(lines) {
    messageQueue = Array.isArray(lines) ? lines : [lines];
    messageIndex = 0;
    gameState = STATE_TALK;
}

// --- セーブ & ロード ---
function saveGame() {
    const saveData = {
        player: player,
        bosses: bosses
    };
    localStorage.setItem('soragon_quest_save', JSON.stringify(saveData));
    showMessage(["ゲームの記録を保存しました！"]);
}

function loadGame() {
    const saveData = localStorage.getItem('soragon_quest_save');
    if (saveData) {
        const parsed = JSON.parse(saveData);
        Object.assign(player, parsed.player);
        parsed.bosses.forEach((b, i) => bosses[i].defeated = b.defeated);
        showMessage(["データをロードしました！"]);
    } else {
        showMessage(["セーブデータが見つかりません。"]);
    }
}

// --- 移動 & 判定更新 ---
function update() {
    if (gameState !== STATE_FIELD) return;

    let dx = 0;
    let dy = 0;

    if (keys['KeyW'] || keys['ArrowUp']) dy -= player.speed;
    if (keys['KeyS'] || keys['ArrowDown']) dy += player.speed;
    if (keys['KeyA'] || keys['ArrowLeft']) dx -= player.speed;
    if (keys['KeyD'] || keys['ArrowRight']) dx += player.speed;

    let nextX = player.x + dx;
    let nextY = player.y + dy;

    // マップ境界チェック
    nextX = Math.max(0, Math.min(MAP_WIDTH - player.size, nextX));
    nextY = Math.max(0, Math.min(MAP_HEIGHT - player.size, nextY));

    // 結界接触チェック（改善ポイント）
    if (nextX < barrier.x + barrier.width &&
        nextX + player.size > barrier.x &&
        nextY < barrier.y + barrier.height &&
        nextY + player.size > barrier.y) {

        if (player.defeatedBosses < 4) {
            // 四天王を倒していない場合は結界を通過させず、メッセージを表示して復帰可能な状態にする
            showMessage([
                "魔王城の結界が立ちはだかっている！",
                "四天王（風・水・炎・雷）をすべて倒さなければ",
                "この結界を破ることはできない！"
            ]);
            return;
        }
    }

    player.x = nextX;
    player.y = nextY;

    // 宿屋・ショップとの接触（SPACEキーでインタラクト）
    if (keys['Space']) {
        if (Math.hypot(player.x - inn.x, player.y - inn.y) < 50) {
            if (player.gold >= 50) {
                player.gold -= 50;
                player.hp = player.maxHp;
                player.mp = player.maxMp;
                showMessage(["宿屋で体力を全回復した！"]);
            } else {
                showMessage(["ゴールドが足りない！(50G必要)"]);
            }
            keys['Space'] = false;
            return;
        }
        if (Math.hypot(player.x - shop.x, player.y - shop.y) < 50) {
            if (player.gold >= 50) {
                player.gold -= 50;
                player.potions++;
                showMessage(["回復薬を1つ買った！"]);
            } else {
                showMessage(["ゴールドが足りない！"]);
            }
            keys['Space'] = false;
            return;
        }
    }

    // 四天王シンボルとの接触 -> バトル開始
    bosses.forEach(boss => {
        if (!boss.defeated && Math.hypot(player.x - boss.x, player.y - boss.y) < 35) {
            startBattle(boss);
        }
    });

    // 魔王との接触 -> バトル開始
    if (player.defeatedBosses >= 4 && Math.hypot(player.x - demonKing.x, player.y - demonKing.y) < 40) {
        startBattle(demonKing);
    }

    // ランダムエンカウント（雑魚敵）
    if ((dx !== 0 || dy !== 0) && Math.random() < 0.005) {
        const mobAtk = 8 + player.level * 2;
        const mobHp = 25 + player.level * 10;
        startBattle({
            name: "魔物の群れ",
            hp: mobHp,
            maxHp: mobHp,
            atk: mobAtk,
            exp: 15 * player.level,
            gold: 20 * player.level,
            color: "#aaaaaa",
            isMob: true
        });
    }
}

// --- バトル処理 ---
function startBattle(enemy) {
    currentEnemy = enemy;
    gameState = STATE_BATTLE;
    battleLog = `${enemy.name} があらわれた！`;
    isPlayerTurn = true;
}

function playerAttack() {
    const totalAtk = player.atk + weapons[player.weaponIndex].atk;
    const damage = Math.max(1, Math.floor(totalAtk * (0.8 + Math.random() * 0.4)) - player.def);
    currentEnemy.hp -= damage;
    battleLog = `あなたの攻撃！ ${currentEnemy.name} に ${damage} のダメージ！`;

    if (currentEnemy.hp <= 0) {
        winBattle();
    } else {
        isPlayerTurn = false;
        setTimeout(enemyTurn, 1000);
    }
}

function switchWeapon() {
    player.weaponIndex = (player.weaponIndex + 1) % weapons.length;
    battleLog = `武器を [${weapons[player.weaponIndex].name}] に変更した！`;
    isPlayerTurn = false;
    setTimeout(enemyTurn, 1000);
}

function useMagicOrItem() {
    if (player.potions > 0) {
        player.potions--;
        const heal = 50;
        player.hp = Math.min(player.maxHp, player.hp + heal);
        battleLog = `回復薬を使った！ HPが ${heal} 回復した！`;
    } else if (player.mp >= 8) {
        player.mp -= 8;
        const damage = 40 + player.level * 5;
        currentEnemy.hp -= damage;
        battleLog = `メラゾーマを唱えた！ ${damage} の魔法ダメージ！`;
        if (currentEnemy.hp <= 0) {
            winBattle();
            return;
        }
    } else {
        battleLog = `アイテムもMPも足りない！`;
        return;
    }
    isPlayerTurn = false;
    setTimeout(enemyTurn, 1000);
}

function playerDefend() {
    isDefending = true;
    battleLog = `身構えている！ ダメージを軽減する。`;
    isPlayerTurn = false;
    setTimeout(enemyTurn, 1000);
}

function enemyTurn() {
    if (gameState !== STATE_BATTLE) return;

    let damage = Math.max(1, Math.floor(currentEnemy.atk * (0.8 + Math.random() * 0.4)) - player.def);
    if (isDefending) {
        damage = Math.floor(damage / 2);
        isDefending = false;
    }

    player.hp -= damage;
    battleLog = `${currentEnemy.name} の攻撃！ ${damage} のダメージを受けた！`;

    if (player.hp <= 0) {
        player.hp = 0;
        alert("全滅しました... 街で復活します。");
        player.hp = player.maxHp;
        player.x = 400;
        player.y = 400;
        gameState = STATE_FIELD;
    } else {
        isPlayerTurn = true;
    }
}

function winBattle() {
    player.exp += currentEnemy.exp;
    player.gold += currentEnemy.gold;
    
    let msg = `勝利した！ ${currentEnemy.exp}EXP と ${currentEnemy.gold}G を獲得！`;

    if (!currentEnemy.isMob) {
        if (currentEnemy === demonKing) {
            gameState = STATE_ENDING;
            return;
        } else {
            currentEnemy.defeated = true;
            player.defeatedBosses++;
            msg += ` 四天王を討伐した！ (残り: ${4 - player.defeatedBosses})`;
        }
    }

    // レベルアップ判定
    if (player.exp >= player.nextExp) {
        player.level++;
        player.maxHp += 15;
        player.hp = player.maxHp;
        player.atk += 4;
        player.def += 2;
        player.nextExp = Math.floor(player.nextExp * 1.5);
        msg += ` レベルアップ！ Lv.${player.level} になった！`;
    }

    showMessage([msg]);
}

// --- 描画処理 ---
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (gameState === STATE_TITLE) {
        drawTitle();
        return;
    }

    if (gameState === STATE_ENDING) {
        drawEnding();
        return;
    }

    // カメラ座標計算（プレイヤー追従）
    const cameraX = player.x - canvas.width / 2;
    const cameraY = player.y - canvas.height / 2;

    ctx.save();
    ctx.translate(-cameraX, -cameraY);

    // フィールド背景グリッド描画
    ctx.strokeStyle = "#222";
    for (let x = 0; x < MAP_WIDTH; x += TILE_SIZE) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, MAP_HEIGHT);
        ctx.stroke();
    }
    for (let y = 0; y < MAP_HEIGHT; y += TILE_SIZE) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(MAP_WIDTH, y);
        ctx.stroke();
    }

    // 拠点（宿屋・道具屋）描画
    ctx.fillStyle = "#00aaaa";
    ctx.fillRect(inn.x - 20, inn.y - 20, 40, 40);
    ctx.fillStyle = "#fff";
    ctx.fillText("宿屋", inn.x - 12, inn.y + 5);

    ctx.fillStyle = "#aa00aa";
    ctx.fillRect(shop.x - 20, shop.y - 20, 40, 40);
    ctx.fillStyle = "#fff";
    ctx.fillText("道具屋", shop.x - 18, shop.y + 5);

    // 魔王城＆結界の描画
    ctx.fillStyle = "#444";
    ctx.fillRect(demonKing.x - 40, demonKing.y - 40, 80, 80);

    if (player.defeatedBosses < 4) {
        // 赤く光る結界
        ctx.fillStyle = "rgba(255, 0, 0, 0.5)";
        ctx.fillRect(barrier.x, barrier.y, barrier.width, barrier.height);
        ctx.fillStyle = "#ffaaaa";
        ctx.fillText("【封印の結界】", barrier.x + 10, barrier.y + 25);
    }

    // 四天王描画
    bosses.forEach(boss => {
        if (!boss.defeated) {
            ctx.fillStyle = boss.color;
            ctx.beginPath();
            ctx.arc(boss.x, boss.y, 18, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#fff";
            ctx.fillText(boss.name, boss.x - 40, boss.y - 25);
        }
    });

    // 魔王描画
    ctx.fillStyle = demonKing.color;
    ctx.beginPath();
    ctx.arc(demonKing.x, demonKing.y, 25, 0, Math.PI * 2);
    ctx.fill();

    // プレイヤー描画
    ctx.fillStyle = "#00ff00";
    ctx.fillRect(player.x, player.y, player.size, player.size);

    ctx.restore();

    // UIオーバーレイ (画面固定)
    drawUI();

    // 戦闘画面オーバーレイ
    if (gameState === STATE_BATTLE) {
        drawBattleScreen();
    }

    // メッセージウィンドウ表示
    if (gameState === STATE_TALK) {
        drawMessageBox();
    }
}

function drawTitle() {
    ctx.fillStyle = "#fff";
    ctx.font = "32px monospace";
    ctx.textAlign = "center";
    ctx.fillText("ソラゴンクエスト", canvas.width / 2, 200);

    ctx.font = "18px monospace";
    ctx.fillText("PRESS SPACE TO START", canvas.width / 2, 350);
    ctx.fillText("四天王を倒し、魔王城の結界を解いて世界を救え！", canvas.width / 2, 420);
}

function drawUI() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
    ctx.fillRect(10, 10, 780, 40);

    ctx.fillStyle = "#fff";
    ctx.font = "14px monospace";
    ctx.textAlign = "left";
    const statusText = `Lv:${player.level}  HP:${player.hp}/${player.maxHp}  MP:${player.mp}/${player.maxMp}  ATK:${player.atk}+${weapons[player.weaponIndex].atk}  DEF:${player.def}  G:${player.gold}  薬:${player.potions}  四天王撃破:${player.defeatedBosses}/4`;
    ctx.fillText(statusText, 20, 35);
}

function drawMessageBox() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 3;
    ctx.fillRect(50, 420, 700, 140);
    ctx.strokeRect(50, 420, 700, 140);

    ctx.fillStyle = "#fff";
    ctx.font = "16px monospace";
    ctx.fillText(messageQueue[messageIndex] || "", 80, 470);

    ctx.font = "12px monospace";
    ctx.fillStyle = "#aaa";
    ctx.fillText("[SPACEキーで進む]", 620, 540);
}

function drawBattleScreen() {
    ctx.fillStyle = "rgba(10, 10, 25, 0.95)";
    ctx.fillRect(50, 50, 700, 500);

    // 敵表示
    ctx.fillStyle = currentEnemy.color;
    ctx.beginPath();
    ctx.arc(400, 180, 40, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#fff";
    ctx.font = "20px monospace";
    ctx.textAlign = "center";
    ctx.fillText(currentEnemy.name, 400, 110);
    ctx.fillText(`HP: ${currentEnemy.hp} / ${currentEnemy.maxHp}`, 400, 250);

    // バトルログ
    ctx.font = "16px monospace";
    ctx.fillText(battleLog, 400, 310);

    // コマンド一覧
    if (isPlayerTurn) {
        ctx.textAlign = "left";
        ctx.fillText("1. 攻撃", 120, 400);
        ctx.fillText(`2. 武器換装 (${weapons[player.weaponIndex].name})`, 120, 440);
        ctx.fillText(`3. 魔法/道具 (薬:${player.potions}個/MP8)`, 420, 400);
        ctx.fillText("4. 防御", 420, 440);
    }
}

function drawEnding() {
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#ffd700";
    ctx.font = "28px monospace";
    ctx.textAlign = "center";
    ctx.fillText("〜 GAME CLEAR 〜", canvas.width / 2, 200);

    ctx.fillStyle = "#fff";
    ctx.font = "16px monospace";
    ctx.fillText("魔王ルシフェルは滅び、世界に平和が戻った！", canvas.width / 2, 280);
    ctx.fillText("あなたの勇気ある行動は永遠に称えられるだろう。", canvas.width / 2, 320);
    ctx.fillText("THANK YOU FOR PLAYING!", canvas.width / 2, 420);
}

// --- メインループ ---
function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
