<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ルミナスの勇者 - Epic Chronicle Edition</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #030712;
            color: #fff;
            font-family: 'Segoe UI', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        #game-wrapper {
            position: relative;
            background-color: #0f172a;
            border: 3px solid #38bdf8;
            border-radius: 12px;
            box-shadow: 0 0 35px rgba(56, 189, 248, 0.3);
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 900px;
            width: 100%;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 22px;
            color: #fbbf24;
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
            letter-spacing: 2px;
        }
        #canvas-container {
            position: relative;
            width: 800px;
            height: 480px;
            border: 3px solid #0284c7;
            border-radius: 8px;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
        #ui-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #020617;
            border: 1px solid #0284c7;
            padding: 8px 15px;
            margin-top: 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
        }
        .stat-group {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .val { color: #38bdf8; }
        .boss-flag { color: #f43f5e; font-weight: bold; }
        #controls-hint {
            margin-top: 8px;
            font-size: 12px;
            color: #94a3b8;
        }
        .key {
            background: #1e293b;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #0284c7;
            color: #38bdf8;
        }
    </style>
</head>
<body>

<div id="game-wrapper">
    <h1>⚔️ ルミナスの勇者 - エピック・クロニクル ⚔️</h1>
    <div id="canvas-container">
        <canvas id="gameCanvas" width="800" height="480"></canvas>
    </div>
    <div id="ui-bar">
        <div class="stat-group">
            <div>LV: <span id="ui-lv" class="val">1</span></div>
            <div>HP: <span id="ui-hp" class="val">120/120</span></div>
            <div>MP: <span id="ui-mp" class="val">40/40</span></div>
            <div>G: <span id="ui-gold" class="val">200</span></div>
            <div>薬: <span id="ui-potions" class="val">3</span></div>
        </div>
        <div class="stat-group">
            <div>幹部撃破: <span id="ui-cadre" class="boss-flag">0 / 4</span></div>
            <div>装備: <span id="ui-weapon" class="val" style="color:#fbbf24">鋼のロングソード</span></div>
            <div>状態: <span id="ui-state" class="val" style="color:#4ade80">フィールド探索</span></div>
        </div>
    </div>
    <div id="controls-hint">
        移動: <span class="key">WASD</span> / <span class="key">↑←↓→</span> | 調べる・決定: <span class="key">SPACE</span> | コマンド: <span class="key">1</span> <span class="key">2</span> <span class="key">3</span> <span class="key">4</span>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let gameState = "FIELD"; // "FIELD", "DIALOGUE", "BATTLE", "SHOP", "INN"

// --- 広大なマップ設定 (3200 x 2400) ---
const WORLD_WIDTH = 3200;
const WORLD_HEIGHT = 2400;
const camera = { x: 0, y: 0, width: 800, height: 480 };

// 武器データベース
const WEAPONS = {
    sword: { id: "sword", name: "鋼のロングソード", type: "斬撃", atk: 25, hitRate: 0.95, price: 0, desc: "標準的な万能剣" },
    dagger: { id: "dagger", name: "影縫いの短剣", type: "刺突", atk: 20, hitRate: 0.98, critRate: 0.35, price: 180, desc: "会心の一撃が出やすい軽刃" },
    axe: { id: "axe", name: "ギガントアックス", type: "打撃", atk: 50, hitRate: 0.75, price: 350, desc: "命中率は低いが超威力の重斧" },
    holy: { id: "holy", name: "聖光のメイス", type: "聖なる光", atk: 40, hitRate: 0.9, price: 500, desc: "魔族や怪異に特効を持つ聖槌" },
    excalibur: { id: "excalibur", name: "伝説の聖剣ルミナス", type: "神聖", atk: 85, hitRate: 0.99, critRate: 0.2, price: 1200, desc: "魔王を討ち払う究極の宝剣" }
};

// プレイヤーデータ
const p = {
    x: 400, y: 2000, size: 22, speed: 4.2, dirX: 0, dirY: 1,
    hp: 120, maxHp: 120, mp: 50, maxMp: 50,
    baseAtk: 15, gold: 200, lv: 1, exp: 0, expToNext: 50,
    potions: 3,
    inventory: ["sword"],
    equippedWeapon: "sword",
    isGuarding: false,
    cadreDefeated: { wind: false, water: false, fire: false, thunder: false }
};

let currentTarget = null;
let currentShopType = null; // "WEAPON" or "ITEM"
let shopSelection = 0;
let battleLog = "戦闘開始！コマンドを選択してください。";
let battleMenuMode = "MAIN";
let battleAnimTimer = 0;
let activeEffect = null;

// --- エリア & 四天王(幹部) & モンスター配置 ---
let npcs = [
    // 始まりの村ルミナス (x: 300-600, y: 1900-2100)
    { x: 380, y: 1950, name: "村の長老", type: "elder", text: "勇者よ！魔王城の結界を解くには、東西南北の4ダンジョンに潜む【四天王】を全て倒さねばならん！" },
    { x: 500, y: 1950, name: "武器屋の親方", type: "merchant", role: "SHOP_WEAPON", text: "いらっしゃい！強力な武器を揃えているぞ。" },
    { x: 500, y: 2050, name: "道具屋", type: "merchant", role: "SHOP_ITEM", text: "回復の薬（50G）はいかがかね？" },
    { x: 380, y: 2050, name: "村の宿屋", type: "inn", role: "INN", text: "1泊 40G でHPとMPを完全回復しますか？" }
];

let enemies = [
    // 野良モンスター（広域に配置）
    { x: 800, y: 1800, name: "野良ゴブリン", hp: 60, maxHp: 60, atk: 12, exp: 25, gold: 30, type: "goblin", size: 24 },
    { x: 1200, y: 1900, name: "草原のオーク", hp: 90, maxHp: 90, atk: 18, exp: 40, gold: 45, type: "goblin", size: 26 },
    { x: 700, y: 1200, name: "岩石ゴーレム", hp: 180, maxHp: 180, atk: 28, exp: 80, gold: 90, type: "golem", size: 32 },
    { x: 2300, y: 1300, name: "氷結ゴーレム", hp: 220, maxHp: 220, atk: 34, exp: 110, gold: 120, type: "golem", size: 34 },

    // 🔥 四天王 (幹部4人)
    { x: 500, y: 500, name: "【疾風将】ゼファー", hp: 350, maxHp: 350, atk: 32, exp: 250, gold: 300, type: "cadre_wind", size: 36, isCadre: "wind" },
    { x: 2700, y: 500, name: "【氷華后】アクアリア", hp: 420, maxHp: 420, atk: 38, exp: 350, gold: 400, type: "cadre_water", size: 36, isCadre: "water" },
    { x: 500, y: 1200, name: "【業火帝】ブレイズ", hp: 520, maxHp: 520, atk: 46, exp: 500, gold: 500, type: "cadre_fire", size: 38, isCadre: "fire" },
    { x: 2700, y: 1200, name: "【雷鳴王】ボルト", hp: 650, maxHp: 650, atk: 55, exp: 700, gold: 700, type: "cadre_thunder", size: 40, isCadre: "thunder" },

    // 👑 最終魔王 (中央結界の先 x: 1600, y: 400)
    { x: 1600, y: 400, name: "【終焉の魔王】ルシフェル", hp: 1200, maxHp: 1200, atk: 70, exp: 0, gold: 0, type: "lucifel", size: 48, isBoss: true }
];

// 環境装飾（広大なマップ用）
const mapDecorations = [];
function generateWorldDecorations() {
    for (let i = 0; i < 400; i++) {
        mapDecorations.push({
            type: 'tree',
            x: Math.random() * WORLD_WIDTH,
            y: Math.random() * WORLD_HEIGHT,
            scale: 0.8 + Math.random() * 0.5
        });
    }
    for (let i = 0; i < 500; i++) {
        mapDecorations.push({
            type: 'flower',
            x: Math.random() * WORLD_WIDTH,
            y: Math.random() * WORLD_HEIGHT,
            color: ['#f43f5e', '#fbbf24', '#c084fc', '#38bdf8'][Math.floor(Math.random() * 4)]
        });
    }
}
generateWorldDecorations();

const keys = {};

window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (gameState === "FIELD" && e.code === 'Space') {
        checkFieldInteraction();
    } else if (gameState === "DIALOGUE" && e.code === 'Space') {
        gameState = "FIELD";
    } else if (gameState === "SHOP") {
        handleShopInput(e.code);
    } else if (gameState === "INN" && e.code === 'Space') {
        executeInn();
    } else if (gameState === "BATTLE") {
        handleBattleInput(e.code);
    }
});

window.addEventListener('keyup', e => { keys[e.code] = false; });

function getDefeatedCadreCount() {
    return Object.values(p.cadreDefeated).filter(Boolean).length;
}

function updateUI() {
    document.getElementById('ui-lv').innerText = p.lv;
    document.getElementById('ui-hp').innerText = `${Math.max(0, p.hp)}/${p.maxHp}`;
    document.getElementById('ui-mp').innerText = `${Math.max(0, p.mp)}/${p.maxMp}`;
    document.getElementById('ui-gold').innerText = p.gold;
    document.getElementById('ui-potions').innerText = p.potions;
    document.getElementById('ui-cadre').innerText = `${getDefeatedCadreCount()} / 4`;
    document.getElementById('ui-weapon').innerText = WEAPONS[p.equippedWeapon].name;
    
    const stateEl = document.getElementById('ui-state');
    if (gameState === "FIELD") { stateEl.innerText = "フィールド探索"; stateEl.style.color = "#4ade80"; }
    else if (gameState === "DIALOGUE") { stateEl.innerText = "会話中"; stateEl.style.color = "#fbbf24"; }
    else if (gameState === "SHOP") { stateEl.innerText = "ショップ利用中"; stateEl.style.color = "#38bdf8"; }
    else if (gameState === "BATTLE") { stateEl.innerText = "斜め対面バトル"; stateEl.style.color = "#f87171"; }
}

function checkFieldInteraction() {
    // 魔王城の結界判定 (x: 1600, y: 650 付近)
    if (Math.hypot(p.x - 1600, p.y - 650) < 60) {
        if (getDefeatedCadreCount() < 4) {
            alert(`🛡️ 強大な結界が魔王城を拒んでいる！\n(四天王をあと ${4 - getDefeatedCadreCount()} 人撃破する必要がある)`);
            return;
        }
    }

    for (let npc of npcs) {
        if (Math.hypot(p.x - npc.x, p.y - npc.y) < 45) {
            currentTarget = npc;
            if (npc.role === "SHOP_WEAPON") {
                gameState = "SHOP"; currentShopType = "WEAPON"; shopSelection = 0;
            } else if (npc.role === "SHOP_ITEM") {
                gameState = "SHOP"; currentShopType = "ITEM"; shopSelection = 0;
            } else if (npc.role === "INN") {
                gameState = "INN";
            } else {
                gameState = "DIALOGUE";
            }
            updateUI();
            return;
        }
    }

    for (let enemy of enemies) {
        if (Math.hypot(p.x - enemy.x, p.y - enemy.y) < 45) {
            if (enemy.isBoss && getDefeatedCadreCount() < 4) {
                alert("⚠️ 四天王を全員倒さなければ魔王に挑むことはできない！");
                return;
            }
            startBattle(enemy);
            return;
        }
    }
}

function handleShopInput(code) {
    if (code === 'KeyW' || code === 'ArrowUp') shopSelection = Math.max(0, shopSelection - 1);
    if (code === 'KeyS' || code === 'ArrowDown') shopSelection++;
    
    if (currentShopType === "WEAPON") {
        const weaponKeys = Object.keys(WEAPONS);
        shopSelection = Math.min(weaponKeys.length - 1, shopSelection);
        if (code === 'Space') {
            const wKey = weaponKeys[shopSelection];
            const w = WEAPONS[wKey];
            if (p.inventory.includes(wKey)) {
                p.equippedWeapon = wKey;
                alert(`🗡️ 【${w.name}】を装備しました！`);
            } else if (p.gold >= w.price) {
                p.gold -= w.price;
                p.inventory.push(wKey);
                p.equippedWeapon = wKey;
                alert(`🛒 【${w.name}】を購入し、装備しました！`);
            } else {
                alert("⚠️ ゴールドが足りません！");
            }
        }
    } else if (currentShopType === "ITEM") {
        shopSelection = 0;
        if (code === 'Space') {
            if (p.gold >= 50) {
                p.gold -= 50;
                p.potions++;
                alert("🧪 回復の薬を購入しました！ (HP 80回復)");
            } else {
                alert("⚠️ ゴールドが足りません！");
            }
        }
    }
    if (code === 'Escape') gameState = "FIELD";
    updateUI();
}

function executeInn() {
    if (p.gold >= 40) {
        p.gold -= 40;
        p.hp = p.maxHp;
        p.mp = p.maxMp;
        alert("🏨 宿屋でぐっすり休んだ！ HPとMPが全回復！");
    } else {
        alert("⚠️ お金が足りません！");
    }
    gameState = "FIELD";
    updateUI();
}

function startBattle(enemy) {
    currentTarget = enemy;
    gameState = "BATTLE";
    battleMenuMode = "MAIN";
    p.isGuarding = false;
    battleLog = `⚔️ ${enemy.name} が現れた！`;
    updateUI();
}

function handleBattleInput(code) {
    if (battleMenuMode === "MAIN") {
        if (code === 'Digit1') executePlayerAttack();
        else if (code === 'Digit2') battleMenuMode = "WEAPON_SELECT";
        else if (code === 'Digit3') battleMenuMode = "SKILL_SELECT";
        else if (code === 'Digit4') executePlayerGuard();
    } else if (battleMenuMode === "WEAPON_SELECT") {
        const weaponKeys = p.inventory;
        if (code === 'Digit1' && weaponKeys[0]) p.equippedWeapon = weaponKeys[0];
        if (code === 'Digit2' && weaponKeys[1]) p.equippedWeapon = weaponKeys[1];
        if (code === 'Digit3' && weaponKeys[2]) p.equippedWeapon = weaponKeys[2];
        if (code === 'Digit4' && weaponKeys[3]) p.equippedWeapon = weaponKeys[3];
        battleLog = `🗡️ 武器を【${WEAPONS[p.equippedWeapon].name}】に変更！`;
        battleMenuMode = "MAIN";
        updateUI();
    } else if (battleMenuMode === "SKILL_SELECT") {
        if (code === 'Digit1') executeSkill("heal");
        else if (code === 'Digit2') executeSkill("fire");
        else if (code === 'Digit3') executeSkill("item");
        else battleMenuMode = "MAIN";
    }
}

function executePlayerAttack() {
    const w = WEAPONS[p.equippedWeapon];
    const hit = Math.random() < w.hitRate;
    let isCrit = w.critRate && Math.random() < w.critRate;

    activeEffect = "SLASH";
    setTimeout(() => { activeEffect = null; }, 600);

    if (!hit) {
        battleLog = `⚔️ 踏み込んで攻撃！しかし ${currentTarget.name} に回避された！`;
    } else {
        let dmg = p.baseAtk + w.atk + Math.floor(Math.random() * 10);
        if (isCrit) dmg = Math.floor(dmg * 1.8);
        currentTarget.hp -= dmg;
        battleLog = `💥 ${w.name} の一閃！ ${currentTarget.name} に ${dmg} ダメージ！${isCrit ? " (会心！)" : ""}`;
    }

    if (checkBattleEnd()) return;
    setTimeout(enemyTurn, 1000);
}

function executePlayerGuard() {
    p.isGuarding = true;
    battleLog = "🛡️ 盾を構えて防御！ (被ダメージ半減)";
    setTimeout(enemyTurn, 1000);
}

function executeSkill(type) {
    if (type === "heal") {
        if (p.mp < 12) { battleLog = "⚠️ MPが足りない！"; return; }
        p.mp -= 12;
        p.hp = Math.min(p.maxHp, p.hp + 60);
        activeEffect = "HEAL";
        setTimeout(() => { activeEffect = null; }, 600);
        battleLog = "✨ 聖なる祈り！ HPが 60 回復！";
    } else if (type === "fire") {
        if (p.mp < 18) { battleLog = "⚠️ MPが足りない！"; return; }
        p.mp -= 18;
        const dmg = 85;
        currentTarget.hp -= dmg;
        activeEffect = "FIRE";
        setTimeout(() => { activeEffect = null; }, 600);
        battleLog = `🔥 業火呪文ヴォルカノ！ ${currentTarget.name} に ${dmg} ダメージ！`;
    } else if (type === "item") {
        if (p.potions <= 0) { battleLog = "⚠️ 回復の薬がない！"; return; }
        p.potions--;
        p.hp = Math.min(p.maxHp, p.hp + 80);
        activeEffect = "HEAL";
        setTimeout(() => { activeEffect = null; }, 600);
        battleLog = "🧪 回復の薬を使用！ HPが 80 回復！";
    }
    battleMenuMode = "MAIN";
    updateUI();
    if (checkBattleEnd()) return;
    setTimeout(enemyTurn, 1000);
}

function enemyTurn() {
    if (currentTarget.hp <= 0) return;
    let dmg = currentTarget.atk + Math.floor(Math.random() * 8);
    if (p.isGuarding) dmg = Math.floor(dmg * 0.5);

    p.hp -= dmg;
    p.isGuarding = false;
    activeEffect = "ENEMY_ATTACK";
    setTimeout(() => { activeEffect = null; }, 600);

    battleLog = `💥 ${currentTarget.name} の猛攻！ 勇者は ${dmg} ダメージを受けた！`;

    if (p.hp <= 0) {
        alert("💀 勇者は倒れてしまった… ルミナス村で復活します。");
        p.hp = p.maxHp;
        p.mp = p.maxMp;
        gameState = "FIELD";
        p.x = 400; p.y = 2000;
    }
    updateUI();
}

function checkBattleEnd() {
    if (currentTarget.hp <= 0) {
        p.gold += currentTarget.gold;
        p.exp += currentTarget.exp;
        battleLog = `🎉 ${currentTarget.name} を撃破！ (${currentTarget.exp} EXP, +${currentTarget.gold}G)`;

        // 幹部撃破フラグの更新
        if (currentTarget.isCadre) {
            p.cadreDefeated[currentTarget.isCadre] = true;
            alert(`🏆 四天王【${currentTarget.name}】を撃破した！ (残り四天王: ${4 - getDefeatedCadreCount()} 人)`);
        }

        // レベルアップ判定
        if (p.exp >= p.expToNext) {
            p.lv++;
            p.maxHp += 25; p.hp = p.maxHp;
            p.maxMp += 10; p.mp = p.maxMp;
            p.baseAtk += 6;
            p.expToNext = Math.floor(p.expToNext * 1.6);
            alert(`🌟 LEVEL UP! LV ${p.lv} になった！ (最大HP/MP・攻撃力上昇)`);
        }

        enemies = enemies.filter(e => e !== currentTarget);
        setTimeout(() => {
            if (currentTarget.isBoss) {
                alert("🎊 CONGRATULATIONS!\n終焉の魔王ルシフェルを完璧に討ち果たし、世界に真の平穏が訪れた！");
            }
            gameState = "FIELD";
            updateUI();
        }, 1200);
        return true;
    }
    return false;
}

function update() {
    battleAnimTimer += 0.05;
    if (gameState !== "FIELD") return;

    let dx = 0, dy = 0;
    if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
    if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) dx += 1;

    if (dx !== 0 || dy !== 0) {
        const len = Math.hypot(dx, dy);
        p.dirX = dx / len; p.dirY = dy / len;
        p.x += p.dirX * p.speed; p.y += p.dirY * p.speed;

        p.x = Math.max(20, Math.min(WORLD_WIDTH - 20, p.x));
        p.y = Math.max(20, Math.min(WORLD_HEIGHT - 20, p.y));
    }

    enemies.forEach(e => {
        if (Math.hypot(p.x - e.x, p.y - e.y) < p.size + e.size) {
            if (e.isBoss && getDefeatedCadreCount() < 4) return;
            startBattle(e);
        }
    });

    camera.x = Math.max(0, Math.min(WORLD_WIDTH - camera.width, p.x - camera.width / 2));
    camera.y = Math.max(0, Math.min(WORLD_HEIGHT - camera.height, p.y - camera.height / 2));
}

// ==========================================
// 🎨 DETAILED CHARACTER & CADRE DRAWING
// ==========================================

function drawDetailedPlayer(ctx, scale = 1) {
    ctx.save();
    ctx.scale(scale, scale);
    ctx.fillStyle = "#1e3a8a";
    ctx.beginPath(); ctx.arc(0, -5, 24, Math.PI, 0); ctx.fill();
    ctx.fillStyle = "#fcd34d";
    ctx.beginPath(); ctx.ellipse(-20, 2, 5, 8, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(20, 2, 5, 8, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#2563eb";
    ctx.beginPath();
    ctx.moveTo(-22, -8); ctx.lineTo(-10, -26); ctx.lineTo(0, -12);
    ctx.lineTo(10, -26); ctx.lineTo(22, -8); ctx.lineTo(18, -2); ctx.lineTo(-18, -2);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#ef4444";
    ctx.beginPath(); ctx.arc(0, -14, 4, 0, Math.PI*2); ctx.fill();
    ctx.restore();
}

function drawBattleHeroDiagonal(ctx, scale = 1.8) {
    ctx.save();
    ctx.scale(scale, scale);
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.beginPath(); ctx.ellipse(0, 35, 25, 10, 0, 0, Math.PI*2); ctx.fill();

    ctx.fillStyle = "#dc2626";
    ctx.beginPath();
    ctx.moveTo(-15, 0); ctx.quadraticCurveTo(-45, 15, -35, 45);
    ctx.quadraticCurveTo(-10, 40, 10, 20); ctx.closePath(); ctx.fill();

    ctx.fillStyle = "#334155"; ctx.fillRect(-14, -10, 28, 38);
    ctx.fillStyle = "#1e40af"; ctx.fillRect(-12, -8, 24, 18);

    ctx.fillStyle = "#94a3b8";
    ctx.beginPath(); ctx.arc(12, -10, 10, 0, Math.PI*2); ctx.fill();

    ctx.fillStyle = "#fcd34d";
    ctx.beginPath(); ctx.arc(0, -25, 16, 0, Math.PI*2); ctx.fill();

    ctx.fillStyle = "#2563eb";
    ctx.beginPath();
    ctx.moveTo(-18, -25); ctx.lineTo(-28, -35); ctx.lineTo(-12, -38);
    ctx.lineTo(2, -45); ctx.lineTo(10, -36); ctx.lineTo(18, -22); ctx.closePath(); ctx.fill();

    ctx.restore();
}

// 幹部4人＋モンスター描画
function drawCadre(ctx, type, scale = 1) {
    ctx.save();
    ctx.scale(scale, scale);
    if (type === "cadre_wind") {
        ctx.fillStyle = "#22c55e";
        ctx.beginPath(); ctx.ellipse(0, 0, 30, 40, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "#86efac";
        ctx.beginPath(); ctx.arc(0, -20, 18, 0, Math.PI*2); ctx.fill();
    } else if (type === "cadre_water") {
        ctx.fillStyle = "#0284c7";
        ctx.beginPath(); ctx.ellipse(0, 0, 32, 42, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "#7dd3fc";
        ctx.beginPath(); ctx.arc(0, -22, 20, 0, Math.PI*2); ctx.fill();
    } else if (type === "cadre_fire") {
        ctx.fillStyle = "#dc2626";
        ctx.beginPath(); ctx.ellipse(0, 0, 35, 45, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "#fca5a5";
        ctx.beginPath(); ctx.arc(0, -25, 22, 0, Math.PI*2); ctx.fill();
    } else if (type === "cadre_thunder") {
        ctx.fillStyle = "#eab308";
        ctx.beginPath(); ctx.ellipse(0, 0, 38, 48, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "#fef08a";
        ctx.beginPath(); ctx.arc(0, -28, 24, 0, Math.PI*2); ctx.fill();
    } else if (type === "goblin") {
        ctx.fillStyle = "#15803d"; ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI*2); ctx.fill();
    } else if (type === "golem") {
        ctx.fillStyle = "#78350f"; ctx.fillRect(-20, -20, 40, 40);
    } else if (type === "lucifel") {
        ctx.fillStyle = "#450a0a"; ctx.beginPath(); ctx.arc(0, 0, 50, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "#facc15"; ctx.beginPath(); ctx.arc(-15, -10, 6, 0, Math.PI*2); ctx.arc(15, -10, 6, 0, Math.PI*2); ctx.fill();
    } else if (type === "elder" || type === "merchant" || type === "inn") {
        ctx.fillStyle = "#3b82f6"; ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
}

function drawCharacter(ctx, type, scale = 1) {
    if (type === "player") drawDetailedPlayer(ctx, scale);
    else drawCadre(ctx, type, scale);
}

// ==========================================
// 🌾 MAP & AREA FIELD RENDERING
// ==========================================

function drawField() {
    ctx.save();
    ctx.translate(-camera.x, -camera.y);

    // 全体背景グラデーション
    ctx.fillStyle = "#14532d";
    ctx.fillRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);

    // 地域ごとのバイオームカラー表現
    // 北西: 氷雪, 北東: 雷鳴荒野, 南西: 風の森, 南東: 溶岩地帯, 中央: 魔王城
    ctx.fillStyle = "rgba(186, 230, 253, 0.25)"; ctx.fillRect(2000, 0, 1200, 1000); // 氷雪
    ctx.fillStyle = "rgba(254, 240, 138, 0.2)"; ctx.fillRect(2000, 1000, 1200, 1400); // 雷
    ctx.fillStyle = "rgba(239, 68, 68, 0.25)"; ctx.fillRect(0, 1000, 1000, 1400); // 溶岩

    // 街道
    ctx.strokeStyle = "#d97706"; ctx.lineWidth = 40; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(400, 2000); ctx.lineTo(1600, 2000); ctx.lineTo(1600, 650);
    ctx.moveTo(1600, 1200); ctx.lineTo(500, 1200);
    ctx.moveTo(1600, 1200); ctx.lineTo(2700, 1200);
    ctx.moveTo(1600, 650); ctx.lineTo(500, 500);
    ctx.moveTo(1600, 650); ctx.lineTo(2700, 500);
    ctx.stroke();

    // 始まりの村ルミナス
    ctx.fillStyle = "#a16207";
    ctx.fillRect(300, 1900, 300, 200);
    ctx.fillStyle = "#fff"; ctx.font = "bold 14px sans-serif";
    ctx.fillText("【始まりの村ルミナス】", 380, 1880);

    // 🏰 中央：魔王城 & 結界
    ctx.fillStyle = "#1e1b4b"; ctx.fillRect(1450, 250, 300, 300);
    ctx.fillStyle = "#f43f5e"; ctx.fillText("【終焉の魔王城】", 1550, 230);
    if (getDefeatedCadreCount() < 4) {
        ctx.strokeStyle = "rgba(244, 63, 94, 0.8)";
        ctx.lineWidth = 8;
        ctx.beginPath(); ctx.arc(1600, 650, 70, 0, Math.PI*2); ctx.stroke();
        ctx.fillStyle = "#f43f5e"; ctx.fillText("封印結界", 1575, 655);
    }

    // 四天王アジト標識
    ctx.fillStyle = "#fff";
    ctx.fillText("【風の塔】", 500, 440);
    ctx.fillText("【氷結洞】", 2700, 440);
    ctx.fillText("【火竜坑】", 500, 1140);
    ctx.fillText("【雷鳴丘】", 2700, 1140);

    // NPCs
    npcs.forEach(npc => {
        ctx.save(); ctx.translate(npc.x, npc.y);
        drawCharacter(ctx, npc.type, 0.8);
        ctx.restore();
        ctx.fillStyle = "#fff"; ctx.font = "bold 12px sans-serif"; ctx.textAlign = "center";
        ctx.fillText(npc.name, npc.x, npc.y - 25);
    });

    // モンスター
    enemies.forEach(e => {
        ctx.save(); ctx.translate(e.x, e.y);
        drawCharacter(ctx, e.type, e.isBoss ? 1.0 : 0.8);
        ctx.restore();
        ctx.fillStyle = "#fff"; ctx.font = "bold 12px sans-serif"; ctx.textAlign = "center";
        ctx.fillText(e.name, e.x, e.y - e.size - 10);
    });

    // プレイヤー
    ctx.save(); ctx.translate(p.x, p.y);
    drawCharacter(ctx, "player", 0.8);
    ctx.restore();

    ctx.restore();
}

function drawShopView() {
    ctx.fillStyle = "#0f172a"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#fbbf24"; ctx.font = "bold 20px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(currentShopType === "WEAPON" ? "⚔️ 武器屋 🛒" : "🧪 道具屋 🛒", canvas.width / 2, 50);

    ctx.fillStyle = "#94a3b8"; ctx.font = "14px sans-serif";
    ctx.fillText(`所持金: ${p.gold} G   [W/S] 選択  [SPACE] 購入・装備  [ESC] 戻る`, canvas.width / 2, 85);

    if (currentShopType === "WEAPON") {
        const weaponKeys = Object.keys(WEAPONS);
        weaponKeys.forEach((key, idx) => {
            const w = WEAPONS[key];
            const isOwned = p.inventory.includes(key);
            const isEquipped = p.equippedWeapon === key;

            const y = 130 + idx * 60;
            ctx.fillStyle = (idx === shopSelection) ? "#1e293b" : "#020617";
            ctx.strokeStyle = (idx === shopSelection) ? "#fbbf24" : "#0284c7";
            ctx.lineWidth = 2;
            ctx.fillRect(100, y, 600, 50);
            ctx.strokeRect(100, y, 600, 50);

            ctx.fillStyle = isEquipped ? "#4ade80" : isOwned ? "#38bdf8" : "#fff";
            ctx.font = "bold 16px sans-serif"; ctx.textAlign = "left";
            ctx.fillText(`${w.name} (攻撃+${w.atk})`, 120, y + 30);

            ctx.fillStyle = "#fbbf24"; ctx.textAlign = "right";
            ctx.fillText(isEquipped ? "【装備中】" : isOwned ? "【所持】" : `${w.price} G`, 680, y + 30);
        });
    } else {
        ctx.fillStyle = "#1e293b"; ctx.strokeStyle = "#fbbf24"; ctx.lineWidth = 2;
        ctx.fillRect(100, 150, 600, 80); ctx.strokeRect(100, 150, 600, 80);
        ctx.fillStyle = "#fff"; ctx.font = "bold 18px sans-serif"; ctx.textAlign = "left";
        ctx.fillText("🧪 回復の薬 (HP 80回復)", 130, 195);
        ctx.fillStyle = "#fbbf24"; ctx.textAlign = "right";
        ctx.fillText("50 G", 670, 195);
    }
}

function drawDialogueView() {
    ctx.fillStyle = "#0f172a"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "rgba(15, 23, 42, 0.95)"; ctx.strokeStyle = "#fbbf24"; ctx.lineWidth = 3;
    ctx.fillRect(40, 310, 720, 130); ctx.strokeRect(40, 310, 720, 130);

    ctx.fillStyle = "#fbbf24"; ctx.font = "bold 18px sans-serif"; ctx.textAlign = "left";
    ctx.fillText(`【 ${currentTarget.name} 】`, 60, 345);
    ctx.fillStyle = "#fff"; ctx.font = "15px sans-serif";
    ctx.fillText(currentTarget.text, 60, 385);
}

function drawBattleView() {
    let skyGrad = ctx.createLinearGradient(0, 0, 0, 220);
    skyGrad.addColorStop(0, "#020617"); skyGrad.addColorStop(1, "#312e81");
    ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, canvas.width, 220);

    let arenaGrad = ctx.createLinearGradient(100, 150, 700, 350);
    arenaGrad.addColorStop(0, "#166534"); arenaGrad.addColorStop(1, "#052e16");
    ctx.fillStyle = arenaGrad;
    ctx.beginPath();
    ctx.moveTo(80, 170); ctx.lineTo(720, 170); ctx.lineTo(800, 340); ctx.lineTo(0, 340);
    ctx.closePath(); ctx.fill();

    // 👹 敵（斜め右上）
    ctx.save();
    const enemyX = 560 + Math.sin(battleAnimTimer * 2) * 5;
    const enemyY = 175 + Math.cos(battleAnimTimer * 1.5) * 3;
    ctx.translate(enemyX, enemyY);
    drawCharacter(ctx, currentTarget.type, currentTarget.isBoss ? 1.8 : 1.3);
    ctx.restore();

    // 🛡️ 勇者（斜め左手前・背中3/4視点）
    ctx.save();
    const heroX = 220, heroY = 270;
    ctx.translate(heroX, heroY);
    drawBattleHeroDiagonal(ctx, 1.4);
    ctx.restore();

    // エフェクト
    if (activeEffect === "SLASH") {
        ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.moveTo(enemyX - 40, enemyY - 40); ctx.lineTo(enemyX + 40, enemyY + 40); ctx.stroke();
    } else if (activeEffect === "FIRE") {
        ctx.fillStyle = "rgba(249, 115, 22, 0.6)";
        ctx.beginPath(); ctx.arc(enemyX, enemyY, 60, 0, Math.PI*2); ctx.fill();
    } else if (activeEffect === "HEAL") {
        ctx.fillStyle = "rgba(74, 222, 128, 0.5)";
        ctx.beginPath(); ctx.arc(heroX, heroY - 20, 50, 0, Math.PI*2); ctx.fill();
    }

    // 敵HP
    ctx.fillStyle = "rgba(15, 23, 42, 0.85)"; ctx.fillRect(40, 20, 280, 60);
    ctx.fillStyle = "#fff"; ctx.font = "bold 15px sans-serif"; ctx.textAlign = "left";
    ctx.fillText(currentTarget.name, 55, 42);
    ctx.fillStyle = "#1e293b"; ctx.fillRect(55, 52, 240, 12);
    ctx.fillStyle = "#ef4444"; ctx.fillRect(55, 52, 240 * Math.max(0, currentTarget.hp / currentTarget.maxHp), 12);

    // 自HP
    ctx.fillStyle = "rgba(15, 23, 42, 0.85)"; ctx.fillRect(480, 210, 280, 65);
    ctx.fillStyle = "#fbbf24"; ctx.font = "bold 15px sans-serif";
    ctx.fillText(`勇者 (LV ${p.lv})`, 495, 232);
    ctx.fillStyle = "#1e293b"; ctx.fillRect(495, 242, 250, 10);
    ctx.fillStyle = "#4ade80"; ctx.fillRect(495, 242, 250 * Math.max(0, p.hp / p.maxHp), 10);
    ctx.fillStyle = "#38bdf8"; ctx.font = "bold 12px sans-serif";
    ctx.fillText(`HP: ${p.hp}/${p.maxHp}  MP: ${p.mp}/${p.maxMp}`, 495, 266);

    // ログ
    ctx.fillStyle = "rgba(15, 23, 42, 0.95)"; ctx.fillRect(30, 285, 740, 45);
    ctx.fillStyle = "#38bdf8"; ctx.font = "14px sans-serif"; ctx.fillText(battleLog, 45, 312);

    // メニュー
    ctx.fillStyle = "rgba(15, 23, 42, 0.95)"; ctx.fillRect(30, 340, 740, 125);
    if (battleMenuMode === "MAIN") {
        drawMenuButton("1. 武器攻撃", 60, 360, 320, 40, "#38bdf8");
        drawMenuButton("2. 武器換装", 420, 360, 320, 40, "#fbbf24");
        drawMenuButton("3. 魔法・道具", 60, 410, 320, 40, "#a855f7");
        drawMenuButton("4. 防御", 420, 410, 320, 40, "#4ade80");
    } else if (battleMenuMode === "WEAPON_SELECT") {
        const inv = p.inventory;
        drawMenuButton(`1. ${WEAPONS[inv[0]] ? WEAPONS[inv[0]].name : '-'}`, 60, 360, 320, 40, "#38bdf8");
        drawMenuButton(`2. ${WEAPONS[inv[1]] ? WEAPONS[inv[1]].name : '-'}`, 420, 360, 320, 40, "#38bdf8");
        drawMenuButton(`3. ${WEAPONS[inv[2]] ? WEAPONS[inv[2]].name : '-'}`, 60, 410, 320, 40, "#38bdf8");
        drawMenuButton(`4. ${WEAPONS[inv[3]] ? WEAPONS[inv[3]].name : '-'}`, 420, 410, 320, 40, "#38bdf8");
    } else if (battleMenuMode === "SKILL_SELECT") {
        drawMenuButton("1. 回復呪文 (12 MP)", 60, 360, 320, 40, "#a855f7");
        drawMenuButton("2. 爆炎呪文 (18 MP)", 420, 360, 320, 40, "#a855f7");
        drawMenuButton(`3. 回復の薬 (${p.potions}個)`, 60, 410, 320, 40, "#4ade80");
    }
}

function drawMenuButton(text, x, y, w, h, color) {
    ctx.fillStyle = "#1e293b"; ctx.strokeStyle = color; ctx.lineWidth = 2;
    ctx.fillRect(x, y, w, h); ctx.strokeRect(x, y, w, h);
    ctx.fillStyle = color; ctx.font = "bold 14px sans-serif"; ctx.textAlign = "left";
    ctx.fillText(text, x + 15, y + 25);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (gameState === "FIELD") drawField();
    else if (gameState === "DIALOGUE" || gameState === "INN") drawDialogueView();
    else if (gameState === "SHOP") drawShopView();
    else if (gameState === "BATTLE") drawBattleView();
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

updateUI();
gameLoop();

</script>
