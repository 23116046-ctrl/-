<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ルミナスの勇者 - Turn-Based Command RPG</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #05070a;
            color: #fff;
            font-family: 'Segoe UI', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        #game-wrapper {
            position: relative;
            background-color: #0f172a;
            border: 3px solid #38bdf8;
            border-radius: 12px;
            box-shadow: 0 0 35px rgba(56, 189, 248, 0.3);
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 860px;
            width: 100%;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 22px;
            color: #fbbf24;
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
            letter-spacing: 2px;
        }
        #canvas-container {
            position: relative;
            width: 800px;
            height: 480px;
            border: 3px solid #0284c7;
            border-radius: 8px;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
        #ui-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #020617;
            border: 1px solid #0284c7;
            padding: 8px 15px;
            margin-top: 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
        }
        .stat-group {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .val { color: #38bdf8; }
        #controls-hint {
            margin-top: 8px;
            font-size: 12px;
            color: #94a3b8;
        }
        .key {
            background: #1e293b;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #0284c7;
            color: #38bdf8;
        }
    </style>
</head>
<body>

<div id="game-wrapper">
    <h1>⚔️ ルミナスの勇者 - Turn-Based Tactics ⚔️</h1>
    <div id="canvas-container">
        <canvas id="gameCanvas" width="800" height="480"></canvas>
    </div>
    <div id="ui-bar">
        <div class="stat-group">
            <div>LV: <span id="ui-lv" class="val">1</span></div>
            <div>HP: <span id="ui-hp" class="val">120/120</span></div>
            <div>MP: <span id="ui-mp" class="val">40/40</span></div>
            <div>G: <span id="ui-gold" class="val">100</span></div>
        </div>
        <div class="stat-group">
            <div>装備中: <span id="ui-weapon" class="val" style="color:#fbbf24">鋼のロングソード</span></div>
            <div>状態: <span id="ui-state" class="val" style="color:#4ade80">フィールド探索</span></div>
        </div>
    </div>
    <div id="controls-hint">
        移動: <span class="key">WASD</span> / <span class="key">↑←↓→</span> | 決定/話しかける/触れる: <span class="key">SPACE</span> | コマンド選択: <span class="key">1</span> <span class="key">2</span> <span class="key">3</span> <span class="key">4</span>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- GAME STATE MANAGEMENT ---
let gameState = "FIELD"; // "FIELD", "DIALOGUE", "BATTLE"

const WORLD_WIDTH = 1600;
const WORLD_HEIGHT = 1200;
const camera = { x: 0, y: 0, width: 800, height: 480 };

// --- WEAPON DATA ---
const WEAPONS = {
    sword: { name: "鋼のロングソード", type: "斬撃", atk: 25, hitRate: 0.95, desc: "標準的で扱いやすい万能剣" },
    dagger: { name: "影縫いの短剣", type: "刺突", atk: 18, hitRate: 0.98, critRate: 0.3, desc: "会心の一撃が出やすい軽量刃" },
    axe: { name: "ギガントアックス", type: "打撃", atk: 45, hitRate: 0.75, desc: "命中は低いが絶大な威力を誇る大斧" },
    holy: { name: "聖光のメイス", type: "聖なる光", atk: 35, hitRate: 0.9, mpCost: 5, desc: "アンデッドや魔王に強い聖なる槌" }
};

// --- PLAYER ---
const p = {
    x: 400, y: 300, size: 18, speed: 3.8, dirX: 0, dirY: 1,
    hp: 120, maxHp: 120, mp: 40, maxMp: 40,
    baseAtk: 15, gold: 100, lv: 1, exp: 0,
    inventory: ["sword", "dagger", "axe", "holy"],
    equippedWeapon: "sword",
    isGuarding: false
};

// --- CURRENT DIALOGUE / BATTLE TARGET ---
let currentTarget = null;
let battleLog = "戦闘開始！コマンドを選択してください。";
let battleMenuMode = "MAIN"; // "MAIN", "WEAPON_SELECT", "SKILL_SELECT"

// --- MAP OBJECTS ---
let enemies = [
    { x: 600, y: 300, name: "野生のゴブリン", hp: 70, maxHp: 70, atk: 14, type: "goblin", size: 20 },
    { x: 1000, y: 500, name: "マグマゴーレム", hp: 160, maxHp: 160, atk: 24, type: "golem", size: 28 },
    { x: 1300, y: 200, name: "最終魔王ルシフェル", hp: 600, maxHp: 600, atk: 42, type: "lucifel", size: 40, isBoss: true }
];

let npcs = [
    { x: 350, y: 220, name: "村の長老", type: "elder", text: "勇者よ、東の最果てに鎮座する【魔王ルシフェル】を打ち倒すのだ。武器の相性を考えて戦うのじゃ！" },
    { x: 450, y: 220, name: "武器商人", type: "merchant", text: "いろいろな武器を使いこなすことが勝利への鍵だよ！状況に応じて武器を切り替えな！" }
];

const keys = {};

window.addEventListener('keydown', e => {
    keys[e.code] = true;

    if (gameState === "FIELD") {
        if (e.code === 'Space') {
            checkFieldInteraction();
        }
    } 
    else if (gameState === "DIALOGUE") {
        if (e.code === 'Space') {
            gameState = "FIELD";
        }
    } 
    else if (gameState === "BATTLE") {
        handleBattleInput(e.code);
    }
});

window.addEventListener('keyup', e => { keys[e.code] = false; });

function updateUI() {
    document.getElementById('ui-lv').innerText = p.lv;
    document.getElementById('ui-hp').innerText = `${Math.max(0, p.hp)}/${p.maxHp}`;
    document.getElementById('ui-mp').innerText = `${Math.max(0, p.mp)}/${p.maxMp}`;
    document.getElementById('ui-gold').innerText = p.gold;
    document.getElementById('ui-weapon').innerText = WEAPONS[p.equippedWeapon].name;
    
    const stateEl = document.getElementById('ui-state');
    if (gameState === "FIELD") { stateEl.innerText = "フィールド探索"; stateEl.style.color = "#4ade80"; }
    else if (gameState === "DIALOGUE") { stateEl.innerText = "対話中"; stateEl.style.color = "#fbbf24"; }
    else if (gameState === "BATTLE") { stateEl.innerText = "ターン制バトル"; stateEl.style.color = "#f87171"; }
}

// --- FIELD INTERACTION ---
function checkFieldInteraction() {
    // Check NPC interaction
    for (let npc of npcs) {
        if (Math.hypot(p.x - npc.x, p.y - npc.y) < 45) {
            currentTarget = npc;
            gameState = "DIALOGUE";
            updateUI();
            return;
        }
    }
    // Check Enemy interaction
    for (let enemy of enemies) {
        if (Math.hypot(p.x - enemy.x, p.y - enemy.y) < 45) {
            startBattle(enemy);
            return;
        }
    }
}

function startBattle(enemy) {
    currentTarget = enemy;
    gameState = "BATTLE";
    battleMenuMode = "MAIN";
    p.isGuarding = false;
    battleLog = `⚔️ ${enemy.name} が立ちはだかった！`;
    updateUI();
}

// --- BATTLE COMMAND SYSTEM ---
function handleBattleInput(code) {
    if (battleMenuMode === "MAIN") {
        if (code === 'Digit1') executePlayerAttack();
        else if (code === 'Digit2') battleMenuMode = "WEAPON_SELECT";
        else if (code === 'Digit3') battleMenuMode = "SKILL_SELECT";
        else if (code === 'Digit4') executePlayerGuard();
    } 
    else if (battleMenuMode === "WEAPON_SELECT") {
        if (code === 'Digit1') p.equippedWeapon = "sword";
        else if (code === 'Digit2') p.equippedWeapon = "dagger";
        else if (code === 'Digit3') p.equippedWeapon = "axe";
        else if (code === 'Digit4') p.equippedWeapon = "holy";
        battleLog = `🗡️ 武器を【${WEAPONS[p.equippedWeapon].name}】に変更した！`;
        battleMenuMode = "MAIN";
        updateUI();
    } 
    else if (battleMenuMode === "SKILL_SELECT") {
        if (code === 'Digit1') executeSkill("heal");
        else if (code === 'Digit2') executeSkill("fire");
        else battleMenuMode = "MAIN";
    }
}

function executePlayerAttack() {
    const w = WEAPONS[p.equippedWeapon];
    const hit = Math.random() < w.hitRate;
    let isCrit = w.critRate && Math.random() < w.critRate;

    if (!hit) {
        battleLog = `⚔️ 攻撃を繰り出したが、${currentTarget.name} にかわされた！`;
    } else {
        let dmg = p.baseAtk + w.atk + Math.floor(Math.random() * 8);
        if (isCrit) dmg = Math.floor(dmg * 1.8);

        currentTarget.hp -= dmg;
        battleLog = `💥 ${w.name} で攻撃！ ${currentTarget.name} に ${dmg} のダメージ！${isCrit ? " (痛恨の一撃！)" : ""}`;
    }

    if (checkBattleEnd()) return;
    setTimeout(enemyTurn, 1000);
}

function executePlayerGuard() {
    p.isGuarding = true;
    battleLog = "🛡️ 勇者は身構えて防御の姿勢をとった！ (被ダメージ半減)";
    setTimeout(enemyTurn, 1000);
}

function executeSkill(type) {
    if (type === "heal") {
        if (p.mp < 10) { battleLog = "⚠️ MPが足りない！"; return; }
        p.mp -= 10;
        const healAmt = 50;
        p.hp = Math.min(p.maxHp, p.hp + healAmt);
        battleLog = `✨ 聖なる回復呪文！ HPが ${healAmt} 回復した！`;
    } else if (type === "fire") {
        if (p.mp < 15) { battleLog = "⚠️ MPが足りない！"; return; }
        p.mp -= 15;
        const dmg = 70;
        currentTarget.hp -= dmg;
        battleLog = `🔥 爆炎呪文ヴォルカノ！ ${currentTarget.name} に ${dmg} の大ダメージ！`;
    }
    battleMenuMode = "MAIN";
    updateUI();
    if (checkBattleEnd()) return;
    setTimeout(enemyTurn, 1000);
}

function enemyTurn() {
    if (currentTarget.hp <= 0) return;

    let dmg = currentTarget.atk + Math.floor(Math.random() * 6);
    if (p.isGuarding) dmg = Math.floor(dmg * 0.5);

    p.hp -= dmg;
    p.isGuarding = false;
    battleLog = `💥 ${currentTarget.name} の苛烈な反撃！ ${dmg} のダメージを受けた！`;

    if (p.hp <= 0) {
        alert("💀 勇者は倒れてしまった… ルミナス村で復活します。");
        p.hp = p.maxHp;
        p.mp = p.maxMp;
        gameState = "FIELD";
        p.x = 400; p.y = 300;
    }
    updateUI();
}

function checkBattleEnd() {
    if (currentTarget.hp <= 0) {
        battleLog = `🎉 ${currentTarget.name} を撃破した！ (金貨 +50G)`;
        p.gold += 50;
        enemies = enemies.filter(e => e !== currentTarget);
        setTimeout(() => {
            if (currentTarget.isBoss) {
                alert("🎊 CONGRATULATIONS! 魔王ルシフェルを打ち倒し、世界に光が戻った！");
            }
            gameState = "FIELD";
            updateUI();
        }, 1200);
        return true;
    }
    return false;
}

// --- UPDATE FIELD ---
function update() {
    if (gameState !== "FIELD") return;

    let dx = 0, dy = 0;
    if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
    if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) dx += 1;

    if (dx !== 0 || dy !== 0) {
        const len = Math.hypot(dx, dy);
        p.dirX = dx / len; p.dirY = dy / len;
        p.x += p.dirX * p.speed; p.y += p.dirY * p.speed;

        p.x = Math.max(20, Math.min(WORLD_WIDTH - 20, p.x));
        p.y = Math.max(20, Math.min(WORLD_HEIGHT - 20, p.y));
    }

    // Touch Enemy on field -> trigger battle
    enemies.forEach(e => {
        if (Math.hypot(p.x - e.x, p.y - e.y) < p.size + e.size) {
            startBattle(e);
        }
    });

    // Camera center
    camera.x = Math.max(0, Math.min(WORLD_WIDTH - camera.width, p.x - camera.width / 2));
    camera.y = Math.max(0, Math.min(WORLD_HEIGHT - camera.height, p.y - camera.height / 2));
}

// --- RENDER FUNCTIONS ---
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (gameState === "FIELD") {
        drawField();
    } else if (gameState === "DIALOGUE") {
        drawDialogueView();
    } else if (gameState === "BATTLE") {
        drawBattleView();
    }
}

// 1. FIELD DRAWING
function drawField() {
    ctx.save();
    ctx.translate(-camera.x, -camera.y);

    // Floor
    ctx.fillStyle = "#1e293b";
    ctx.fillRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);

    // Grid Lines
    ctx.strokeStyle = "rgba(255,255,255,0.05)";
    for (let x = 0; x < WORLD_WIDTH; x += 80) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, WORLD_HEIGHT); ctx.stroke();
    }

    // NPCs
    npcs.forEach(npc => {
        ctx.fillStyle = "#fbbf24";
        ctx.beginPath(); ctx.arc(npc.x, npc.y, 14, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "#fff"; ctx.font = "12px sans-serif"; ctx.fillText(npc.name, npc.x - 18, npc.y - 20);
    });

    // Enemies
    enemies.forEach(e => {
        ctx.fillStyle = e.isBoss ? "#ef4444" : "#a855f7";
        ctx.beginPath(); ctx.arc(e.x, e.y, e.size, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "#fff"; ctx.font = "12px sans-serif"; ctx.fillText(e.name, e.x - 25, e.y - e.size - 8);
    });

    // Player
    ctx.fillStyle = "#38bdf8";
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();

    ctx.restore();
}

// 2. FACE-TO-FACE DIALOGUE VIEW (対面視点)
function drawDialogueView() {
    // Dark Backdrop
    ctx.fillStyle = "#0f172a";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Render Face-to-Face Portrait
    ctx.save();
    ctx.translate(canvas.width / 2, 180);

    if (currentTarget.type === "elder") {
        // Detailed Village Elder Portrait
        ctx.fillStyle = "#fef08a"; ctx.beginPath(); ctx.arc(0, 0, 65, 0, Math.PI*2); ctx.fill(); // Head
        ctx.fillStyle = "#e2e8f0"; ctx.beginPath(); ctx.arc(0, 30, 45, 0, Math.PI); ctx.fill(); // Long Beard
        ctx.fillStyle = "#475569"; ctx.fillRect(-70, -75, 140, 25); // Hat Rim
        ctx.fillRect(-45, -110, 90, 40); // Hat Top
        ctx.fillStyle = "#0f172a"; ctx.fillRect(-25, -15, 12, 12); ctx.fillRect(15, -15, 12, 12); // Eyes
    } 
    else if (currentTarget.type === "merchant") {
        ctx.fillStyle = "#fed7aa"; ctx.beginPath(); ctx.arc(0, 0, 60, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "#ea580c"; ctx.beginPath(); ctx.arc(0, -20, 65, Math.PI, Math.PI*2); ctx.fill(); // Hood
        ctx.fillStyle = "#0f172a"; ctx.fillRect(-20, -10, 10, 10); ctx.fillRect(10, -10, 10, 10);
    }

    ctx.restore();

    // Dialogue Box Window
    ctx.fillStyle = "rgba(15, 23, 42, 0.95)";
    ctx.strokeStyle = "#fbbf24";
    ctx.lineWidth = 3;
    ctx.fillRect(40, 310, 720, 130);
    ctx.strokeRect(40, 310, 720, 130);

    ctx.fillStyle = "#fbbf24";
    ctx.font = "bold 18px sans-serif";
    ctx.fillText(`【 ${currentTarget.name} 】`, 60, 345);

    ctx.fillStyle = "#fff";
    ctx.font = "15px sans-serif";
    ctx.fillText(currentTarget.text, 60, 385);

    ctx.fillStyle = "#94a3b8";
    ctx.font = "12px sans-serif";
    ctx.fillText("Press [SPACE] to close", 600, 425);
}

// 3. FRONT-VIEW TURN-BASED BATTLE SCENE (対面視点戦闘)
function drawBattleView() {
    // Battle Background Gradient
    let bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    bgGrad.addColorStop(0, "#1e1b4b");
    bgGrad.addColorStop(1, "#020617");
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 🎨 DETAILED ENEMY FRONT VIEW (対面描画)
    ctx.save();
    ctx.translate(canvas.width / 2, 170);

    if (currentTarget.type === "lucifel") {
        // 魔王ルシフェルの詳細グラフィック (Detailed Demon King Face & Horns)
        // Red Glowing Aura
        ctx.fillStyle = "rgba(239, 68, 68, 0.25)";
        ctx.beginPath(); ctx.arc(0, 0, 110 + Math.sin(Date.now()*0.005)*8, 0, Math.PI*2); ctx.fill();

        // Demon Crown / Giant Horns
        ctx.fillStyle = "#450a0a";
        ctx.beginPath();
        ctx.moveTo(-70, -30); ctx.lineTo(-110, -110); ctx.lineTo(-40, -60);
        ctx.moveTo(70, -30); ctx.lineTo(110, -110); ctx.lineTo(40, -60);
        ctx.fill();

        // Face Structure
        ctx.fillStyle = "#7f1d1d";
        ctx.beginPath(); ctx.arc(0, 0, 75, 0, Math.PI*2); ctx.fill();

        // Glowing Eyes
        ctx.fillStyle = "#fef08a";
        ctx.beginPath();
        ctx.arc(-28, -12, 14, 0, Math.PI*2);
        ctx.arc(28, -12, 14, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = "#dc2626";
        ctx.beginPath();
        ctx.arc(-28, -12, 6, 0, Math.PI*2);
        ctx.arc(28, -12, 6, 0, Math.PI*2);
        ctx.fill();

        // Fangs / Mouth
        ctx.fillStyle = "#000";
        ctx.beginPath(); ctx.arc(0, 35, 22, 0, Math.PI); ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.moveTo(-12, 35); ctx.lineTo(-6, 48); ctx.lineTo(0, 35);
        ctx.moveTo(12, 35); ctx.lineTo(6, 48); ctx.lineTo(0, 35);
        ctx.fill();
    }
    else if (currentTarget.type === "goblin") {
        ctx.fillStyle = "#15803d";
        ctx.beginPath(); ctx.arc(0, 0, 55, 0, Math.PI*2); ctx.fill(); // Head
        // Ears
        ctx.beginPath(); ctx.moveTo(-50, 0); ctx.lineTo(-85, -25); ctx.lineTo(-40, -25); ctx.fill();
        ctx.beginPath(); ctx.moveTo(50, 0); ctx.lineTo(85, -25); ctx.lineTo(40, -25); ctx.fill();
        // Red Eyes
        ctx.fillStyle = "#ef4444";
        ctx.fillRect(-22, -12, 10, 10); ctx.fillRect(12, -12, 10, 10);
    }
    else {
        // Golem
        ctx.fillStyle = "#78716c";
        ctx.fillRect(-65, -65, 130, 130);
        ctx.fillStyle = "#f59e0b";
        ctx.fillRect(-35, -20, 70, 12);
    }

    ctx.restore();

    // Enemy Name & HP Bar
    ctx.fillStyle = "#fff";
    ctx.font = "bold 18px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(currentTarget.name, canvas.width/2, 40);

    ctx.fillStyle = "#1e293b";
    ctx.fillRect(250, 50, 300, 14);
    ctx.fillStyle = "#ef4444";
    ctx.fillRect(250, 50, 300 * Math.max(0, currentTarget.hp / currentTarget.maxHp), 14);

    // Battle Log Box
    ctx.fillStyle = "rgba(15, 23, 42, 0.9)";
    ctx.strokeStyle = "#0284c7";
    ctx.lineWidth = 2;
    ctx.fillRect(30, 280, 740, 50);
    ctx.strokeRect(30, 280, 740, 50);
    ctx.fillStyle = "#38bdf8";
    ctx.font = "14px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText(battleLog, 45, 310);

    // Turn Command Menu (コマンド UI)
    ctx.fillStyle = "rgba(15, 23, 42, 0.95)";
    ctx.strokeStyle = "#fbbf24";
    ctx.fillRect(30, 340, 740, 125);
    ctx.strokeRect(30, 340, 740, 125);

    if (battleMenuMode === "MAIN") {
        drawMenuButton("1. 武器で攻撃", 60, 360, 320, 40, "#38bdf8");
        drawMenuButton("2. 武器換装 (装備変更)", 420, 360, 320, 40, "#fbbf24");
        drawMenuButton("3. 魔法・特技", 60, 410, 320, 40, "#a855f7");
        drawMenuButton("4. 防御 (半減)", 420, 410, 320, 40, "#4ade80");
    } 
    else if (battleMenuMode === "WEAPON_SELECT") {
        drawMenuButton("1. ロングソード (斬撃)", 60, 360, 320, 40, "#38bdf8");
        drawMenuButton("2. 影縫いの短剣 (刺突)", 420, 360, 320, 40, "#38bdf8");
        drawMenuButton("3. ギガントアックス (打撃)", 60, 410, 320, 40, "#38bdf8");
        drawMenuButton("4. 聖光のメイス (聖光)", 420, 410, 320, 40, "#38bdf8");
    } 
    else if (battleMenuMode === "SKILL_SELECT") {
        drawMenuButton("1. 聖なる回復 (10 MP)", 60, 360, 320, 40, "#a855f7");
        drawMenuButton("2. 爆炎呪文 (15 MP)", 420, 360, 320, 40, "#a855f7");
        drawMenuButton("3. キャンセル", 60, 410, 320, 40, "#94a3b8");
    }
}

function drawMenuButton(text, x, y, w, h, color) {
    ctx.fillStyle = "#1e293b";
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.fillRect(x, y, w, h);
    ctx.strokeRect(x, y, w, h);

    ctx.fillStyle = color;
    ctx.font = "bold 14px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText(text, x + 15, y + 25);
}

// Main Loop
function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

updateUI();
gameLoop();

</script>
</body>
</html>
